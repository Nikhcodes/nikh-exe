<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NIKH.EXE | Under Construction Forever</title>
<meta name="description" content="Nikhiel Lingard's personal corner of the internet: music, projects, and late-night things.">
<link href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Courier+Prime:wght@400;700&family=Newsreader:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/reveal.css">
<style>
:root{--ink:#0d1018;--navy:#14213a;--char:#22252d;--burg:#6b1f2e;--red:#b8343f;--amber:#e0a458;--cream:#f1e7d3;--paper:#e6d9bd;--disp:'Bowlby One',Impact,sans-serif;--mono:'Courier Prime',ui-monospace,monospace;--serif:'Newsreader',Georgia,serif}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
html{background:var(--ink)}
body{font-family:var(--serif);font-size:1.08rem;line-height:1.6;color:var(--cream);background:var(--ink);overflow-x:hidden;min-height:100vh;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
a{color:var(--amber)}
:focus-visible{outline:3px solid var(--amber);outline-offset:3px}
.mono{font-family:var(--mono)}
header{display:flex;flex-wrap:wrap;align-items:center;gap:8px 22px;padding:14px 22px;border-bottom:3px double var(--burg);background:var(--char);position:sticky;top:0;z-index:20}
.logo{font-family:var(--disp);font-size:1.15rem;color:var(--amber);text-decoration:none;transform:rotate(-1.5deg);display:inline-block}
nav{display:flex;flex-wrap:wrap;gap:4px}
nav a{font-family:var(--mono);font-weight:700;text-decoration:none;color:var(--cream);padding:8px 12px;border:2px solid transparent;font-size:.9rem}
nav a:hover{border-color:var(--amber);transform:rotate(-2deg)}
nav a[aria-current=page]{background:var(--amber);color:var(--ink);transform:rotate(-2deg)}
#view{animation:in .35s ease}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
.wrap{max-width:1100px;margin:0 auto;padding:34px 22px 60px}
h1,h2,h3{font-family:var(--disp);font-weight:400;line-height:1.05}
h1{font-size:clamp(2.4rem,7vw,4.8rem)}
h2{font-size:1.6rem;margin-bottom:12px}
.tape{display:inline-block;background:rgba(224,164,88,.85);color:var(--ink);font-family:var(--mono);font-weight:700;font-size:.8rem;padding:3px 14px;transform:rotate(-3deg)}
/* HOME */
.home{display:grid;grid-template-columns:290px 1fr;gap:28px}
.side{display:grid;gap:18px;align-self:start}
.box{border:2px solid var(--burg);background:var(--char);padding:16px}
.box h3{font-family:var(--mono);font-weight:700;font-size:.8rem;letter-spacing:.1em;text-transform:uppercase;background:var(--burg);margin:-16px -16px 12px;padding:6px 16px}
.avatar{aspect-ratio:1;background:repeating-linear-gradient(45deg,var(--navy) 0 10px,var(--ink) 10px 20px);display:grid;place-items:center;font-family:var(--disp);font-size:3rem;color:var(--amber);border:2px solid var(--amber);margin-bottom:10px}
.status{font-family:var(--mono);color:var(--amber)}
.stick{display:flex;flex-wrap:wrap;gap:8px}
.stick span{font-family:var(--mono);font-size:.82rem;border:1.5px dashed var(--amber);padding:2px 9px;transition:transform .2s}
.stick span:nth-child(odd){transform:rotate(-2deg)}
.stick span:nth-child(even){transform:rotate(1.5deg)}
.stick span:hover{transform:rotate(4deg) scale(1.12);background:var(--amber);color:var(--ink)}
.hero p.big{font-size:1.5rem;font-style:italic;max-width:30ch;margin:16px 0}
.btn{display:inline-block;font-family:var(--mono);font-weight:700;padding:11px 18px;background:var(--amber);color:var(--ink);text-decoration:none;border:2px solid var(--amber);margin:4px 8px 4px 0;cursor:pointer;font-size:1rem}
.btn:hover{background:transparent;color:var(--amber)}
.btn.ghost{background:transparent;color:var(--amber)}
.btn.ghost:hover{background:var(--amber);color:var(--ink)}
.picks{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-top:30px}
#pick{font-family:var(--disp);font-size:1.4rem;color:var(--amber);min-height:2.6em}
.updates li{list-style:none;padding:6px 0;border-bottom:1px dotted var(--grey,#777)}
.updates b{font-family:var(--mono);color:var(--amber);font-size:.85rem}
/* PROJECTS */
.paper{background:var(--paper);color:#241b14;min-height:80vh}
.paper a{color:var(--burg)}
.paper .tape{background:var(--burg);color:var(--cream)}
.pj{display:grid;grid-template-columns:1.1fr 1fr;gap:26px;padding:30px 0;border-top:2px solid #241b14}
.pj:nth-of-type(even){direction:rtl}
.pj:nth-of-type(even)>*{direction:ltr}
.art{min-height:200px;padding:20px;position:relative;display:flex;flex-direction:column;justify-content:center;gap:8px}
.art.rig{background:#0f1a14;color:#7ee0a3;font-family:var(--mono);font-size:.85rem;border:2px solid #7ee0a3;background-image:linear-gradient(#17301f 1px,transparent 1px),linear-gradient(90deg,#17301f 1px,transparent 1px);background-size:22px 22px}
.art.rig .n{border:1px solid #7ee0a3;padding:3px 8px;display:inline-block}
.art.rig .w{border-color:#ff9d5c;color:#ff9d5c}
.art.mj{background:#c9a66b;color:#2a1a0c}
.art.mj div{background:#f6e9c8;padding:8px 12px;box-shadow:2px 3px 0 rgba(0,0,0,.25);font-family:var(--mono);font-size:.82rem}
.art.mj div:nth-child(1){transform:rotate(-2deg)}
.art.mj div:nth-child(2){transform:rotate(1.5deg);margin-left:24px}
.art.mj div:nth-child(3){transform:rotate(-1deg)}
.art.led{background:#fbf6e8;border:1px solid #241b14;font-family:var(--mono);font-size:.82rem;background-image:repeating-linear-gradient(transparent 0 25px,#9bb7d4 25px 26px)}
.art.os{background:var(--navy);color:var(--cream)}
.phone{width:150px;height:200px;border:5px solid var(--char);border-radius:22px;background:var(--ink);padding:12px;margin:0 auto;font-family:var(--mono);font-size:.7rem;display:grid;gap:6px;align-content:start}
.phone i{display:block;background:var(--burg);height:16px;border-radius:4px}
.phone i:nth-child(2){background:var(--amber)}
.art.cam{background:#111;color:#fff;border:2px solid #333;font-family:var(--mono)}
.art.cam::before{content:"";position:absolute;inset:18px;border:2px solid rgba(255,255,255,.7);clip-path:polygon(0 0,18% 0,18% 3px,3px 3px,3px 18%,0 18%,0 0)}
.art.cam .rec{color:#ff4b4b}
.pj h3{font-size:1.8rem;margin:4px 0 8px}
.stk{font-family:var(--mono);font-size:.8rem;opacity:.85}
.lk{margin-top:10px;font-family:var(--mono);font-weight:700}
.lk a{margin-right:16px}
/* MUSIC: a record crate */
.dividers{display:flex;flex-wrap:wrap;gap:4px 6px;margin:26px 0 0;padding-left:8px}
.dividers button{font-family:var(--mono);font-weight:700;font-size:.85rem;background:#e9dcc0;color:#241b14;border:2px solid #241b14;border-bottom:0;padding:7px 14px 9px;border-radius:8px 8px 0 0;cursor:pointer;transform:translateY(6px);box-shadow:inset 0 -6px 0 var(--c)}
.dividers button[aria-selected=true]{background:var(--cream);transform:translateY(0);box-shadow:inset 0 -6px 0 var(--c),0 -2px 0 var(--c)}
.dividers button:hover{transform:translateY(2px)}.dividers button[aria-selected=true]:hover{transform:none}
.crate{position:relative;border:3px solid #241b14;border-top-width:2px;background:#3a2617 repeating-linear-gradient(90deg,rgba(0,0,0,.18) 0 2px,transparent 2px 90px);overflow-x:auto;overflow-y:hidden;scrollbar-width:thin;padding:40px 14px 0}
.spines{position:relative;display:flex;align-items:flex-end;gap:3px;min-height:236px;min-width:max-content;padding:0 6px}
.spines::after{content:"";position:absolute;left:-14px;right:-14px;bottom:0;height:64px;background:#4b3120 repeating-linear-gradient(0deg,rgba(0,0,0,.12) 0 1px,transparent 1px 7px);border-top:3px solid #241b14;box-shadow:0 -6px 10px rgba(0,0,0,.35);pointer-events:none;z-index:3}
.spine{position:relative;flex:0 0 var(--w);height:226px;background:var(--c) center/cover;filter:brightness(calc(1 - var(--shade)*.12));border:1px solid rgba(0,0,0,.45);border-radius:2px 2px 0 0;color:var(--cream);cursor:pointer;padding:10px 0 70px;transform:rotate(var(--lean));transform-origin:bottom center;transition:transform .25s ease-out,filter .2s;box-shadow:inset -4px 0 0 rgba(0,0,0,.18),inset 3px 0 0 rgba(255,255,255,.08)}
.spine span{display:block;writing-mode:vertical-rl;transform:rotate(180deg);font-family:var(--disp);font-size:.95rem;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-height:146px;margin:0 auto;text-shadow:0 1px 2px rgba(0,0,0,.5)}
.spine:hover{transform:rotate(0) translateY(-10px);filter:brightness(1.08)}
.spine.out{transform:rotate(0) translateY(-36px);filter:brightness(1.15);z-index:2}
.spine:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.crate-empty{color:var(--cream);font-family:var(--mono);padding:30px 10px 90px}
.pulled{display:grid;grid-template-columns:minmax(220px,340px) 1fr;gap:clamp(60px,12vw,160px);align-items:center;margin:34px 0 10px;min-height:260px}
.record{position:relative;width:100%;max-width:340px;aspect-ratio:1}
.sleeve{position:absolute;inset:0;z-index:1;background:var(--c);border:2px solid #241b14;box-shadow:6px 6px 0 rgba(0,0,0,.45);overflow:hidden;display:grid;place-items:end start;padding:16px}
.sleeve img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.sleeve-type{font-family:var(--disp);font-size:clamp(1.4rem,4vw,2.2rem);line-height:.95;color:var(--cream);max-width:9ch;overflow-wrap:anywhere}
.vinyl{position:absolute;top:4%;left:4%;width:92%;height:92%;border-radius:50%;background:#111 repeating-radial-gradient(circle,#1b1b1b 0 1px,#0c0c0c 1px 3px);box-shadow:0 0 0 2px #000;transition:transform .6s cubic-bezier(.2,.8,.25,1)}
.vinyl span{position:absolute;inset:34%;border-radius:50%;background:var(--c);box-shadow:inset 0 0 0 3px rgba(0,0,0,.25)}
.vinyl span::after{content:"";position:absolute;inset:44%;border-radius:50%;background:#0c0c0c}
.record.slid .vinyl{transform:translateX(38%)}
.liner{max-width:52ch;padding-left:4px}
.liner-label{display:flex;flex-wrap:wrap;gap:4px 14px;font-family:var(--mono);font-weight:700;font-size:.85rem;color:var(--amber);margin:0}
.liner-label span{color:#999;font-weight:400}
.liner h2{font-size:clamp(1.8rem,4.5vw,2.8rem);margin:6px 0 12px;line-height:1}
.liner-note{font-size:1.15rem;line-height:1.6;font-style:italic;margin:0 0 14px}
.liner .listen{font-size:.95rem;gap:8px 16px}
.liner .listen .play{padding:7px 14px}
.dig{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;margin:26px 0 0}
.dig .btn{margin:0}
.dig .mono{font-size:.8rem;opacity:.7}
@media(max-width:720px){.pulled{grid-template-columns:1fr;gap:22px}.record{max-width:250px}.record.slid .vinyl{transform:translateX(28%)}.spines{min-height:206px}.spine{height:196px}}
/* LINKS */
.bk{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;margin:22px 0 40px}
.bk a{display:block;text-decoration:none;color:var(--cream);border:2px solid var(--burg);background:var(--char);padding:14px 16px;transition:transform .2s,border-color .2s}
.bk a:hover{transform:rotate(-1.5deg) translateY(-3px);border-color:var(--amber)}
.bk b{font-family:var(--disp);font-weight:400;font-size:1.25rem;color:var(--amber);display:block}
.bk small{font-family:var(--mono);font-size:.8rem}
.btn88{display:inline-block;width:88px;height:31px;line-height:27px;text-align:center;font-family:var(--mono);font-weight:700;font-size:.72rem;border:2px outset var(--amber);color:var(--ink);background:var(--amber);text-decoration:none;margin:0 6px 8px 0}
.btn88:hover{background:var(--cream)}
.heroes{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:18px;margin-top:18px}
.card{--mx:50%;--my:50%;position:relative;background:var(--cream);color:#241b14;padding:12px 12px 14px;border:3px solid #241b14;outline:4px solid var(--cream);outline-offset:-10px;box-shadow:5px 5px 0 rgba(0,0,0,.5);min-height:170px;display:flex;flex-direction:column;gap:6px;transition:transform .25s ease-out;overflow:hidden;min-width:0}
.card:nth-child(odd){transform:rotate(-1.2deg)}
.card:nth-child(even){transform:rotate(1.2deg)}
.card:hover,.card:focus-visible{transition:transform .08s linear}
.card:focus-visible{transform:rotate(0) scale(1.03)}
.card b{font-family:var(--disp);font-weight:400;font-size:1.4rem;line-height:1.05;overflow-wrap:anywhere;hyphens:auto}
.card b.long{font-size:1.15rem}
.card b.xlong{font-size:1rem}
.card small{font-family:var(--mono);font-weight:700;color:var(--burg)}
.card-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-family:var(--mono);font-size:.72rem}
.card-no{font-family:var(--mono);font-size:.7rem;font-weight:700;opacity:.65}
.card .flavor{margin:0;font-style:italic;font-size:.95rem;line-height:1.35;border-top:1.5px solid rgba(36,27,20,.35);padding-top:6px}
.card-rare{margin-top:auto;align-self:flex-end;font-family:var(--mono);font-size:.68rem;font-weight:700;background:#241b14;color:var(--amber);padding:1px 7px}
.card.holo::after{content:"";position:absolute;inset:0;pointer-events:none;mix-blend-mode:color-dodge;opacity:0;transition:opacity .25s;
 background:radial-gradient(circle at var(--mx) var(--my),rgba(255,255,255,.55),transparent 38%),linear-gradient(115deg,transparent 20%,rgba(224,164,88,.35) 35%,rgba(126,224,163,.3) 48%,rgba(207,218,230,.35) 60%,transparent 75%);background-size:100% 100%,250% 250%;background-position:center,var(--mx) var(--my)}
.card.holo:hover::after,.card.holo:focus-visible::after{opacity:.45}
/* BROWSER WINDOW (links) */
.bw{margin:22px 0 40px;border:2px solid #241b14;background:var(--char);box-shadow:8px 8px 0 rgba(0,0,0,.45);overflow:hidden}
.bw-bar{display:flex;align-items:flex-end;gap:10px;background:#15171d;padding:8px 10px 0}
.bw-dots{display:flex;gap:6px;padding-bottom:12px;flex:0 0 auto}
.bw-dots i{width:11px;height:11px;border-radius:50%;background:var(--red)}.bw-dots i:nth-child(2){background:var(--amber)}.bw-dots i:nth-child(3){background:#7ee0a3}
.bw-tabs{display:flex;align-items:flex-end;gap:2px;overflow-x:auto;scrollbar-width:thin;min-width:0}
.bw-tab{display:flex;align-items:center;gap:7px;min-width:0;max-width:190px;flex:0 0 auto;padding:8px 10px;background:#22252d;color:#b9ae9c;border:1px solid #2f323b;border-bottom:0;font-family:var(--mono);font-weight:700;font-size:.82rem;cursor:pointer;border-radius:6px 6px 0 0}
.bw-tab[aria-selected=true]{background:var(--cream);color:#241b14;border-color:var(--cream)}
.bw-tab:hover{color:var(--cream)}.bw-tab[aria-selected=true]:hover{color:#241b14}
.bw-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fav{display:grid;place-items:center;width:16px;height:16px;flex:0 0 16px;border-radius:3px;color:#fff;font-size:.68rem;font-family:var(--mono)}
.bw-x{opacity:.45;font-weight:400}
.bw-plus{padding:6px 10px;color:#777;font-family:var(--mono)}
.bw-addr{display:flex;gap:12px;align-items:center;background:var(--cream);color:#241b14;padding:8px 12px;font-family:var(--mono);font-size:.82rem;border-bottom:1px solid rgba(36,27,20,.25)}
.bw-url{flex:1;min-width:0;background:#fbf6e8;border:1px solid rgba(36,27,20,.3);border-radius:14px;padding:3px 12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bw-page{background:#fbf6e8;color:#241b14;padding:26px 24px;min-height:190px;background-image:radial-gradient(rgba(36,27,20,.07) 1px,transparent 1.5px);background-size:16px 16px}
.bw-page h3{font-family:var(--disp);font-weight:400;font-size:clamp(1.6rem,4vw,2.4rem);margin:2px 0 6px}
.bw-host{font-family:var(--mono);font-size:.78rem;font-weight:700;color:var(--burg);margin:0}
.bw-note{font-style:italic;font-size:1.15rem;margin:0 0 16px;max-width:50ch}
.bw-page .btn{margin:0}
.bw-status{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 16px;background:#15171d;color:#999;font-family:var(--mono);font-size:.72rem;padding:5px 12px}
.grab{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px}
.grab .btn{margin:0;padding:6px 12px;font-size:.85rem}
.btn88-img{image-rendering:pixelated;box-shadow:3px 3px 0 rgba(0,0,0,.4)}
#copy88-out{font-size:.78rem;overflow-wrap:anywhere;max-width:100%}
@media(prefers-reduced-motion:reduce){.card.holo::after{transition:none}}
/* GUESTBOOK */
.guestbook-page{max-width:820px;margin:0 auto}
.guestbook-page>.tape{display:table;margin:0 auto 8px}
.guestbook-page>h1,.guestbook-page>.guestbook-intro{text-align:center;margin-left:auto;margin-right:auto}
.guestbook-intro{max-width:55ch;margin-top:12px}
.gf{display:grid;gap:10px;width:100%;max-width:520px;margin:24px auto 34px;border:2px solid var(--burg);background:var(--char);padding:18px;text-align:left;box-shadow:6px 6px 0 rgba(0,0,0,.25)}
.gf label{font-family:var(--mono);font-weight:700;font-size:.85rem}
.gf input,.gf textarea{font:inherit;padding:10px;background:var(--ink);color:var(--cream);border:2px solid var(--burg);width:100%;min-width:0;border-radius:0}
.gf input:focus,.gf textarea:focus{outline:3px solid var(--amber);outline-offset:2px}
.gf textarea{min-height:110px;resize:vertical}
.gf .btn{justify-self:start;margin:4px 0}
#gm{min-height:1.6em;overflow-wrap:anywhere}
.guestbook-page.board-page{max-width:1040px}
.board-wrap{border:2px solid var(--burg);background:var(--char) radial-gradient(rgba(224,164,88,.13) 1px,transparent 1.5px) 0 0/18px 18px;padding:30px clamp(14px,3vw,30px) 26px;box-shadow:6px 6px 0 rgba(0,0,0,.25)}
.board-head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 16px;font-family:var(--mono);font-size:.8rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--amber);margin:-14px 0 20px}
#gl{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:26px 22px;align-items:start;text-align:left;overflow-wrap:anywhere}
#gl:empty{display:none}
.board-empty{grid-column:1/-1;text-align:center;font-family:var(--mono);font-size:.9rem;padding:20px 0}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.gb{--rot:0deg;position:relative;background:var(--note,var(--cream));color:#241b14;padding:20px 16px 14px;box-shadow:3px 4px 0 rgba(0,0,0,.45);transform:rotate(var(--rot));transition:transform .2s;overflow-wrap:anywhere;min-height:120px}
.gb::before{content:"";position:absolute;top:-7px;left:50%;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:var(--red);box-shadow:inset -2px -2px 0 rgba(0,0,0,.3),1px 2px 2px rgba(0,0,0,.4)}
.gb:hover{transform:rotate(0)}
.gb.n1{--note:#f3dca8}.gb.n2{--note:#ecc9c4}.gb.n3{--note:#cfdae6}.gb.n4{--note:#d9e3c6}
.gb.r1{--rot:-1.6deg}.gb.r2{--rot:1.2deg}.gb.r3{--rot:-.6deg}.gb.r4{--rot:.8deg}
.gb.featured{grid-column:span 2;border-top:6px solid var(--burg)}
.gb.featured::before{display:none}
.gb .pin-tape{position:absolute;top:-12px;left:14px;background:var(--burg);color:var(--cream);font-family:var(--mono);font-weight:700;font-size:.7rem;padding:2px 10px;transform:rotate(-3deg)}
.gb b{font-family:var(--disp);font-weight:400;display:block;line-height:1.1}
.gb time{font-family:var(--mono);font-size:.74rem;color:var(--burg)}
.gb p{margin-top:8px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:1rem;line-height:1.5}
.gb.featured p{font-size:1.15rem;font-style:italic}
.gb .gb-reply{margin-top:10px;padding-top:8px;border-top:1.5px dashed rgba(36,27,20,.45);font-family:var(--mono);font-size:.86rem;color:var(--burg);font-style:normal}
.gb .gb-reply b{font-family:var(--mono);display:inline;font-weight:700}
.board-more{display:block;margin:26px auto 0}
@media(max-width:520px){.gf{padding:14px}.gb.featured{grid-column:auto}.guestbook-page h1{font-size:clamp(2.2rem,11vw,4rem)}#gl{grid-template-columns:1fr}}
/* JOURNAL: a photocopied zine */
.zine-intro{max-width:55ch;margin-top:10px}
.zine{display:grid;grid-template-columns:230px minmax(0,1fr);gap:48px;margin-top:34px;align-items:start}
.zine-toc{position:sticky;top:90px;border-top:3px solid #241b14;padding-top:10px}

<script>
/* Page content lives in assets/content.js (defaults) and in the admin panel (Admin → Pages).
   The last version received from the server is remembered in this browser, so pages don't flash old text. */
const D=window.NIKH_DEFAULTS;
let C={},MEDIA={};
try{const c=JSON.parse(localStorage.getItem('nikh-content')||'null');if(c&&c.content){C=c.content;MEDIA=c.media||{}}}catch{}
const S=k=>Object.assign({},D[k],C[k]||{});
const M=id=>(id&&MEDIA[id])||null;
const $=s=>document.querySelector(s),v=$('#view');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeUrl=u=>{u=String(u||'').trim();return /^(https?:\/\/|mailto:|#\/)/i.test(u)?u:''};
const safeColor=c=>/^#[0-9a-f]{3,8}$/i.test(c||'')?c:'#2b3a5c';
const img=(i,cls,extra)=>i?`<img${cls?` class="${cls}"`:''} src="${esc(i.url)}" alt="${esc(i.alt)}" width="${+i.w||''}" height="${+i.h||''}" loading="lazy" decoding="async"${extra||''}>`:'';
/* Plain text with blank lines between paragraphs; lines starting with "- " become a list. */
const textHtml=t=>String(t||'').split(/\n\s*\n/).map(b=>{const L=b.split('\n').filter(x=>x.trim());
 return L.length&&L.every(x=>/^\s*-\s+/.test(x))?`<ul>${L.map(x=>`<li>${esc(x.replace(/^\s*-\s+/,''))}</li>`).join('')}</ul>`:`<p>${L.map(esc).join('<br>')}</p>`}).join('');
/* Spotify / YouTube links can be played on the page (the player loads only after a click). */
function embedOf(u){try{const x=new URL(u);
 if(x.hostname==='open.spotify.com'){const m=x.pathname.match(/^\/(?:intl-[a-z-]+\/)?(track|album|playlist|artist|episode|show)\/([A-Za-z0-9]+)/);if(m)return{src:`https://open.spotify.com/embed/${m[1]}/${m[2]}`,h:/track|episode/.test(m[1])?152:380}}
 let id=null;
 if(/(^|\.)youtube\.com$/.test(x.hostname))id=x.searchParams.get('v')||(x.pathname.match(/^\/(?:shorts|embed|live)\/([\w-]{11})/)||[])[1];
 if(x.hostname==='youtu.be')id=x.pathname.slice(1,12);
 if(id&&/^[\w-]{11}$/.test(id))return{src:`https://www.youtube-nocookie.com/embed/${id}?autoplay=1`,h:0,video:1}
}catch{}return null}
function player(link,title){
 const e=embedOf(link);if(!e)return;
 const d=document.createElement('dialog');d.className='rv player';d.setAttribute('aria-label','Player: '+title);
 d.innerHTML=`<div class="rv-card"><span class="rv-tape">NOW PLAYING</span><button class="rv-close" type="button" aria-label="Close">×</button><h2 class="rv-title"></h2><div class="frame${e.video?' video':''}"><iframe title="" src="${esc(e.src)}" ${e.h?`height="${e.h}"`:''} allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe></div><p class="mono small-note">Playback comes from ${e.video?'YouTube':'Spotify'}. Closing this stops it.</p></div>`;
 d.querySelector('.rv-title').textContent=title;d.querySelector('iframe').title=title;
 d.querySelector('.rv-close').onclick=()=>d.close();
 d.addEventListener('click',ev=>{if(ev.target===d)d.close()});
 d.addEventListener('close',()=>d.remove());
 document.body.append(d);d.showModal()
}
const listenBtns=(link,title)=>{const u=safeUrl(link);if(!u)return'';return `<span class="listen">${embedOf(u)?`<button class="play" type="button" data-play="${esc(u)}" data-title="${esc(title)}">▶ Play here</button>`:''}<a href="${esc(u)}" target="_blank" rel="noopener">Listen ↗</a></span>`};
document.addEventListener('click',ev=>{const b=ev.target instanceof Element&&ev.target.closest('[data-play]');if(b)player(b.dataset.play,b.dataset.title)});
/* "Tabs that are always open", as an actual browser window. */
const host=u=>{try{return new URL(u).hostname.replace(/^www\./,'')}catch{return u}};
const favColor=t=>['#a8442b','#7a2a63','#2b3a5c','#5a4a1a','#1c4a4a','#6b1f2e'][[...String(t)].reduce((a,c)=>a+c.charCodeAt(0),0)%6];
function browserWin(links){

 <div class="bw-status"><span>${links.length} tabs open · using ${(links.length*0.38+0.4).toFixed(1)} GB of RAM, as usual</span><span>no, I will not close any of them</span></div></div>`
}
function wireBrowser(){
 const w=$('.bw');if(!w)return;
 const L=JSON.parse(w.dataset.links),tabs=[...w.querySelectorAll('.bw-tab')],page=$('#bwp'),url=$('#bwu');
 const show=i=>{const l=L[i];tabs.forEach((t,k)=>{t.setAttribute('aria-selected',k==i);t.tabIndex=k==i?0:-1});page.setAttribute('aria-labelledby','bwt'+i);
  url.textContent=l.u.replace(/^https?:\/\//,'');
  page.innerHTML=`<p class="bw-host">${esc(host(l.u))}</p><h3>${esc(l.n)}</h3><p class="bw-note">${esc(l.t)}</p><a class="btn" href="${esc(l.u)}" target="_blank" rel="noopener">Open in a real tab ↗</a>`};
 tabs.forEach((t,i)=>{t.onclick=()=>show(i);t.onkeydown=e=>{const d={ArrowRight:1,ArrowLeft:-1}[e.key];if(e.key=='Home'||e.key=='End'||d){e.preventDefault();const n=e.key=='Home'?0:e.key=='End'?tabs.length-1:(i+d+tabs.length)%tabs.length;tabs[n].focus();show(n)}}});
 show(0)
}
/* Hero cards: a holo shine that follows the pointer, with a small tilt (none with reduced motion). */
function wireHolo(){
 const still=matchMedia('(prefers-reduced-motion: reduce)').matches;
 document.querySelectorAll('.card.holo').forEach(c=>{
  c.onpointermove=e=>{const r=c.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;
   c.style.setProperty('--mx',(x*100).toFixed(1)+'%');c.style.setProperty('--my',(y*100).toFixed(1)+'%');
   if(!still)c.style.transform=`perspective(700px) rotateY(${((x-.5)*14).toFixed(2)}deg) rotateX(${((.5-y)*14).toFixed(2)}deg) scale(1.03)`};
  c.onpointerleave=()=>{c.style.transform='';c.style.removeProperty('--mx');c.style.removeProperty('--my')}
 })
}

 ${h.showCounter?`<div class="box counter" id="counter" ${SITE.hits?'':'hidden'}><h3>Visitors</h3><p class="odo" id="odo" aria-label="${SITE.hits} visits">${odo(SITE.hits)}</p><p class="mono odo-note">since the last rebuild. Hi, you.</p></div>`:''}</aside>
 <section class="hero"><span class="tape" data-egg-target="welcome-tape">${esc(h.tape)}</span><h1>${esc(h.headline)}</h1><p class="big">${esc(h.blurb)}</p>
 <a class="btn" href="#/projects">See what I build</a><a class="btn ghost" href="#/music">Flip through the crate</a>

 projects(){const P=S('projects');return `<div class="paper"><div class="wrap"><span class="tape">THE WORKBENCH</span><h1>Things I've built</h1><p style="max-width:50ch;margin-top:10px">${esc(P.intro)}</p>
 ${(P.projects||[]).map(p=>{const pi=M(p.image);return `<article class="pj">${pi?`<div class="art photo">${img(pi)}</div>`:`<div class="art ${esc(p.art)}">${ART[p.art]||''}</div>`}<div><span class="tape">${esc(p.tagline)}</span><h3>${esc(p.name)}</h3><p>${esc(p.description)}</p><p class="stk">${esc(p.stack)}</p><p class="lk">${(p.links||[]).filter(x=>safeUrl(x.url)).map(x=>`<a href="${esc(safeUrl(x.url))}" target="_blank" rel="noopener">${esc(x.label)} ↗</a>`).join('')}</p></div></article>`}).join('')}</div></div>`},

 <div class="dividers" role="tablist" aria-label="Crates">${cr.map((c,i)=>`<button role="tab" aria-selected="${i==0}" data-c="${i}" style="--c:${safeColor(c.color)}">${esc(c.name)}</button>`).join('')}</div>
 <div class="crate"><div class="spines" id="spines" role="group" aria-label="Records in this crate"></div></div>

  return `<article class="card holo" tabindex="0" aria-label="${esc(h.name)}, ${esc(h.category)}"><div class="card-top"><small>${esc(h.category)}</small><span class="card-no">No. ${String(i+1).padStart(3,'0')}/${String(all.length).padStart(3,'0')}</span></div>${hi?img(hi,'hero-img'):''}<b class="${n>16?'xlong':n>11?'long':''}">${esc(h.name)}</b><p class="flavor">${esc(h.note)}</p><span class="card-rare" aria-hidden="true">★ HERO</span></article>`}).join('')}</div>
 <h2 style="margin-top:40px">Grab my button</h2><p class="mono" style="margin-bottom:10px">88x31, because some traditions deserve to live. Put it on your site and we're officially web neighbours.</p>

 <button class="btn ghost" type="button" id="copy88">Copy the code</button><span class="mono" id="copy88-out" role="status"></span></div></div>`},
 guestbook(){return `<div class="wrap"><section class="guestbook-page board-page"><span class="tape">SIGN HERE</span><h1>Guestbook</h1><p class="guestbook-intro">Pin a note to the board. Leave a message, recommend something, or prove that a real human made it this far. I approve notes by hand before they go up.</p>

 <div class="hp" aria-hidden="true"><label>Leave this empty<input name="website" tabindex="-1" autocomplete="off"></label></div>

 scrapbook(){return `<div class="paper"><div class="wrap"><span class="tape">THE SHOEBOX</span><h1>Scrapbook</h1><p style="max-width:52ch;margin-top:10px">Photos, small memories and other things worth keeping. Added whenever something deserves a spot.</p>
 <div class="sb" id="sb" aria-live="polite"><p class="sb-empty">Opening the shoebox...</p></div></div></div>`},
 journal(){const J=S('journal'),E=jEntries(),tags=[...new Set(E.flatMap(j=>j.tags||[]))];return `<div class="paper zine-page"><div class="wrap"><span class="tape">THE ZINE</span><h1>Journal</h1><p class="zine-intro">${esc(J.intro)}</p>

 ${tags.length?`<p class="toc-file">File under</p><div class="zine-tags" role="group" aria-label="Filter by topic"><button data-t="" aria-pressed="true">everything</button>${tags.map(t=>`<button data-t="${esc(t)}" aria-pressed="false">${esc(t)}</button>`).join('')}</div>`:''}</aside>

 contact(){const K=S('contact'),opt=(u,t,s)=>safeUrl(u)?`<a class="contact-option" href="${esc(safeUrl(u))}" target="_blank" rel="noopener"><b>${t} ↗</b><small>${s}</small></a>`:'';return `<div class="paper"><div class="wrap ct">

const nav=[["home","Home"],["about","About"],["projects","Projects"],["journal","Journal"],["scrapbook","Scrapbook"],["links","Links"],["guestbook","Guestbook"],["music","Music"],["arcade","Arcade"],["contact","Contact"]];

   let h=0;for(const c of (e.k||e.name))h=(h*31+c.charCodeAt(0))>>>0;
   const a=document.createElement('article');a.className=`gb n${h%5} r${(h>>3)%5}`+(featured?' featured':'');
   if(featured){const tp=document.createElement('span');tp.className='pin-tape';tp.textContent='PINNED BY NIKH';a.append(tp)}
   const b=document.createElement('b');b.textContent=e.name;
   const t=document.createElement('time');t.dateTime=e.created_at;t.textContent=new Date(e.created_at).toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'});
   const p=document.createElement('p');p.textContent=e.message;
   a.append(b,t,p);
   if(e.reply){const r=document.createElement('p');r.className='gb-reply';const who=document.createElement('b');who.textContent='↳ nikh ';r.append(who,document.createTextNode(e.reply));a.append(r)}
   return a
  };
  const page=()=>fetch('/api/guestbook'+(oldest?'?before='+encodeURIComponent(oldest):'')).then(r=>{if(!r.ok)throw 0;return r.json()}).then(d=>{
   if(!oldest)L.textContent='';
   (d.featured||[]).forEach(e=>L.append(note(e,true)));
   d.entries.forEach(e=>L.append(note(e,false)));
   shown+=(d.featured||[]).length+d.entries.length;
   if(d.entries.length)oldest=d.entries[d.entries.length-1].created_at;
   if(!shown){const p=document.createElement('p');p.className='board-empty';p.textContent='The board is empty. Pin the first note.';L.append(p)}
   $('#gcount').textContent=shown?shown+(d.more?'+':'')+(shown==1?' note':' notes'):'';
   more.hidden=!d.more
  });
  page().catch(()=>{
   L.innerHTML='<p class="board-empty"></p>';L.firstChild.textContent='The guestbook is offline here. It only works once the site is deployed with its backend.';
   $('#gf').hidden=true
  });
  more.onclick=()=>{more.disabled=true;page().catch(()=>{}).finally(()=>{more.disabled=false})};
  $('#gf').onsubmit=async ev=>{
   ev.preventDefault();
   const f=ev.target;M.textContent='Sending...';
   try{
    const r=await fetch('/api/guestbook',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({nm:f.elements.nm.value,msg:f.elements.msg.value,website:f.elements.website.value})});
    const d=await r.json().catch(()=>({}));
    if(r.ok){f.reset();M.textContent='Pinned to the waiting tray. It goes up on the board once I approve it.'}
    else M.textContent=d.error||'Something went wrong.'
   }catch(e){M.textContent='Could not reach the guestbook.'}
  }
 }
 if(k=='journal'){
  const E=jEntries();
  const show=t=>{
   const list=E.filter(j=>!t||(j.tags||[]).includes(t));
   $('#jn').innerHTML=list.length?list.map(j=>`<article class="zentry" id="j-${j.slug}"><div class="zhead"><span class="stamp">${esc(j.date)}</span><h2><a href="#/journal/${j.slug}">${esc(j.title)}</a></h2><p class="zmeta">${j.mins} min read</p></div>
    <div class="zbody">${textHtml(j.body)}</div>
    <div class="zfoot">${(j.tags||[]).length?`<span>Filed under ${(j.tags||[]).map(esc).join(', ')}</span>`:'<span></span>'}<button class="zcopy" type="button" data-slug="${j.slug}">Copy link</button></div></article>`).join('<div class="cut" aria-hidden="true"><span>✂</span></div>'):'<p class="zbody">Nothing filed under that yet.</p>';
   document.querySelectorAll('.zine-toc li').forEach(li=>li.classList.toggle('dim',!list.some(j=>j.slug==li.dataset.slug)));
   document.querySelectorAll('.zine-tags button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.t==t));
   document.querySelectorAll('.zcopy').forEach(b=>b.onclick=async()=>{const u=location.origin+location.pathname+'#/journal/'+b.dataset.slug;
    try{await navigator.clipboard.writeText(u);b.textContent='Link copied'}catch{b.textContent=u}setTimeout(()=>{b.textContent='Copy link'},2500)})
  };
  show('');
  document.querySelectorAll('.zine-tags button').forEach(b=>b.onclick=()=>show(b.dataset.t));
  const want=subRoute();
  if(want){const a=document.getElementById('j-'+want);if(a){a.classList.add('here');requestAnimationFrame(()=>a.scrollIntoView({block:'start'}))}}
 }
 if(k=='music'){
  const cr=S('music').crates||[];
  let cur=0;
  /* Pull one record out of the crate onto the panel below. */
  const pull=(ci,ri,focus)=>{
   const c=cr[ci],it=c&&(c.items||[])[ri];if(!it)return;
   const col=safeColor(c.color),cv=M(it.cover);
   document.querySelectorAll('.spine').forEach((b,k)=>{b.classList.toggle('out',k==ri);b.setAttribute('aria-pressed',k==ri)});
   const P=$('#pulled');
   P.innerHTML=`<div class="record" style="--c:${col}"><div class="vinyl" aria-hidden="true"><span></span></div><div class="sleeve">${cv?img(cv):`<span class="sleeve-type">${esc(it.title)}</span>`}</div></div>
   <div class="liner"><p class="liner-label">${esc(it.label)}<span>${esc(c.name)}</span></p><h2>${esc(it.title)}</h2>${it.note?`<p class="liner-note">${esc(it.note)}</p>`:''}${listenBtns(it.link,it.title)}</div>`;
   requestAnimationFrame(()=>requestAnimationFrame(()=>{const r=P.querySelector('.record');r&&r.classList.add('slid')}));
   if(focus){const sp=document.querySelectorAll('.spine')[ri];sp&&sp.scrollIntoView({block:'nearest',inline:'center'})}
  };
  const open=(ci,ri=0,focus)=>{
   cur=ci;const c=cr[ci];if(!c)return;
   document.querySelectorAll('.dividers button').forEach(b=>b.setAttribute('aria-selected',b.dataset.c==ci));
   const items=c.items||[];
   $('#spines').innerHTML=items.map((it,i)=>{const cv=M(it.cover);let h=0;for(const ch of String(it.title))h=(h*31+ch.charCodeAt(0))>>>0;
    return `<button class="spine" type="button" aria-pressed="false" style="--c:${safeColor(c.color)};--w:${40+h%22}px;--lean:${((h>>4)%5-2)*.6}deg;--shade:${(h>>8)%3}" ${cv?`data-cover="${esc(cv.url)}"`:''}><span>${esc(it.title)}</span></button>`}).join('')||'<p class="crate-empty">This crate is empty.</p>';
   document.querySelectorAll('.spine').forEach((b,i)=>{if(b.dataset.cover)b.style.backgroundImage=`linear-gradient(rgba(13,16,24,.55),rgba(13,16,24,.55)),url("${b.dataset.cover}")`;
    b.onclick=()=>pull(cur,i);
    b.onkeydown=e=>{const d={ArrowRight:1,ArrowLeft:-1}[e.key];if(d){e.preventDefault();const all=document.querySelectorAll('.spine'),n=(i+d+all.length)%all.length;all[n].focus();pull(cur,n,true)}}});
   pull(ci,ri,focus)
  };
  open(0);
  document.querySelectorAll('.dividers button').forEach(b=>b.onclick=()=>open(+b.dataset.c));
  $('#msh').onclick=()=>{
   const all=cr.flatMap((c,ci)=>(c.items||[]).map((it,ri)=>[ci,ri]));
   if(!all.length)return;
   const [ci,ri]=all[Math.floor(Math.random()*all.length)];
   open(ci,ri,true);window.NikhSound&&NikhSound.drawer()
  }
 }
}
let baseTitle=document.title;
addEventListener('hashchange',()=>render());
render();
/* A cheeky tab title while the visitor looks at another tab. */
document.addEventListener('visibilitychange',()=>{const t=S('home').awayTitle;if(!t)return;document.title=document.hidden?t:baseTitle});
/* Fresh content from the server. Re-render only if something actually changed. */
document.addEventListener('nikh:config',ev=>{
 if(!ev.detail)return;
 SITE.counts=ev.detail.counts;SITE.settings=ev.detail.settings||{};
 const fresh={content:ev.detail.content||{},media:ev.detail.media||{}};
 const changed=JSON.stringify(fresh)!==JSON.stringify({content:C,media:MEDIA});
 C=fresh.content;MEDIA=fresh.media;
 try{localStorage.setItem('nikh-content',JSON.stringify(fresh))}catch{}
 const k=route();
 if(changed||k=='home')render(true);else drawNav(k)
});
/* Retro visitor counter: counts one visit per browser session. Nothing about the visitor is stored. */
(async()=>{try{
 let first=false;try{first=!sessionStorage.getItem('nikh-hit');sessionStorage.setItem('nikh-hit','1')}catch{}
 const r=await fetch('/api/public?r=hit',{method:first?'POST':'GET'});if(!r.ok)return;
 SITE.hits=(await r.json()).n;
 const box=$('#counter');if(box){box.hidden=!SITE.hits;$('#odo').innerHTML=odo(SITE.hits);$('#odo').setAttribute('aria-label',SITE.hits+' visits')}
}catch{}})();
let seen=[];
try{seen=JSON.parse(sessionStorage.getItem('nikh-drawer'))||[]}catch{}
async function openDrawer(){
 const out=$('#dr-out'),btn=$('#dr');btn.disabled=true;
 try{
  const r=await fetch('/api/public?r=surprise&x='+seen.slice(-10).join(','));
  if(!r.ok)throw 0;
  const {item}=await r.json();
  if(!item){out.innerHTML='<p class="mono">The drawer is empty right now.</p>';return}
  seen.push(item.id);try{sessionStorage.setItem('nikh-drawer',JSON.stringify(seen.slice(-20)))}catch{}
  window.NikhSound&&NikhSound.drawer();
  out.innerHTML=item.kind=='image'
   ?`<figure>${img(item)}${item.caption?`<figcaption>${esc(item.caption)}</figcaption>`:''}</figure>`
   :`<p class="dr-note">${esc(item.body)}</p>${item.caption?`<p class="mono" style="font-size:.8rem;margin-top:8px">${esc(item.caption)}</p>`:''}`;
  const im=out.querySelector('img');if(im)im.onerror=()=>{out.innerHTML='<p class="mono">That one fell behind the drawer. Try again.</p>'};
  btn.textContent='Another one'
 }catch(e){out.innerHTML='<p class="mono">The drawer is stuck. Try again later.</p>'}
 finally{btn.disabled=false}
}
async function loadScrapbook(){
 const box=$('#sb');
 try{
  const r=await fetch('/api/public?r=scrapbook');if(!r.ok)throw 0;
  const {entries}=await r.json();
  if(!entries.length){box.innerHTML='<p class="sb-empty">Nothing in the shoebox yet. Check back soon.</p>';return}
  box.innerHTML=entries.map(e=>`<article class="sbe">${e.images[0]?img(e.images[0]):''}${e.images.length>1?`<div class="thumbs">${e.images.slice(1).map(i=>img(i)).join('')}</div>`:''}
   ${e.date?`<time datetime="${esc(e.date)}">${new Date(e.date+'T12:00:00').toLocaleDateString(undefined,{year:'numeric',month:'long',day:'numeric'})}</time>`:''}
   ${e.title?`<h2>${esc(e.title)}</h2>`:''}${e.body?`<p>${esc(e.body)}</p>`:''}</article>`).join('');
  box.querySelectorAll('img').forEach(i=>i.onerror=()=>i.remove())
 }catch(e){box.innerHTML='<p class="sb-empty">The scrapbook is offline here. It needs the deployed backend.</p>'}
}
</script>
