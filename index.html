<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NIKH.EXE | Under Construction Forever</title>
<meta name="description" content="Nikhiel Lingard's personal corner of the internet: music, projects, and late-night things.">
<link href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Courier+Prime:wght@400;700&family=Newsreader:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{--ink:#0d1018;--navy:#14213a;--char:#22252d;--burg:#6b1f2e;--red:#b8343f;--amber:#e0a458;--cream:#f1e7d3;--paper:#e6d9bd;--disp:'Bowlby One',Impact,sans-serif;--mono:'Courier Prime',ui-monospace,monospace;--serif:'Newsreader',Georgia,serif}
*{box-sizing:border-box;margin:0}
html{background:var(--ink)}
body{font-family:var(--serif);font-size:1.08rem;line-height:1.6;color:var(--cream);background:var(--ink);overflow-x:hidden;min-height:100vh;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
a{color:var(--amber)}
:focus-visible{outline:3px solid var(--amber);outline-offset:3px}
.mono{font-family:var(--mono)}
header{display:flex;flex-wrap:wrap;align-items:center;gap:8px 22px;padding:14px 22px;border-bottom:3px double var(--burg);background:var(--char);position:sticky;top:0;z-index:20}
.logo{font-family:var(--disp);font-size:1.15rem;color:var(--amber);text-decoration:none;transform:rotate(-1.5deg);display:inline-block}
nav{display:flex;flex-wrap:wrap;gap:4px}
nav a{font-family:var(--mono);font-weight:700;text-decoration:none;color:var(--cream);padding:8px 12px;border:2px solid transparent;font-size:.9rem}
nav a:hover{border-color:var(--amber);transform:rotate(-2deg)}
nav a[aria-current=page]{background:var(--amber);color:var(--ink);transform:rotate(-2deg)}
#view{animation:in .35s ease}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
.wrap{max-width:1100px;margin:0 auto;padding:34px 22px 60px}
h1,h2,h3{font-family:var(--disp);font-weight:400;line-height:1.05}
h1{font-size:clamp(2.4rem,7vw,4.8rem)}
h2{font-size:1.6rem;margin-bottom:12px}
.tape{display:inline-block;background:rgba(224,164,88,.85);color:var(--ink);font-family:var(--mono);font-weight:700;font-size:.8rem;padding:3px 14px;transform:rotate(-3deg)}
/* HOME */
.home{display:grid;grid-template-columns:290px 1fr;gap:28px}
.side{display:grid;gap:18px;align-self:start}
.box{border:2px solid var(--burg);background:var(--char);padding:16px}
.box h3{font-family:var(--mono);font-weight:700;font-size:.8rem;letter-spacing:.1em;text-transform:uppercase;background:var(--burg);margin:-16px -16px 12px;padding:6px 16px}
.avatar{aspect-ratio:1;background:repeating-linear-gradient(45deg,var(--navy) 0 10px,var(--ink) 10px 20px);display:grid;place-items:center;font-family:var(--disp);font-size:3rem;color:var(--amber);border:2px solid var(--amber);margin-bottom:10px}
.status{font-family:var(--mono);color:var(--amber)}
.stick{display:flex;flex-wrap:wrap;gap:8px}
.stick span{font-family:var(--mono);font-size:.82rem;border:1.5px dashed var(--amber);padding:2px 9px;transition:transform .2s}
.stick span:nth-child(odd){transform:rotate(-2deg)}.stick span:nth-child(even){transform:rotate(1.5deg)}
.stick span:hover{transform:rotate(4deg) scale(1.12);background:var(--amber);color:var(--ink)}
.hero p.big{font-size:1.5rem;font-style:italic;max-width:30ch;margin:16px 0}
.btn{display:inline-block;font-family:var(--mono);font-weight:700;padding:11px 18px;background:var(--amber);color:var(--ink);text-decoration:none;border:2px solid var(--amber);margin:4px 8px 4px 0;cursor:pointer;font-size:1rem}
.btn:hover{background:transparent;color:var(--amber)}
.btn.ghost{background:transparent;color:var(--amber)}.btn.ghost:hover{background:var(--amber);color:var(--ink)}
.picks{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-top:30px}
#pick{font-family:var(--disp);font-size:1.4rem;color:var(--amber);min-height:2.6em}
.updates li{list-style:none;padding:6px 0;border-bottom:1px dotted var(--grey,#777)}
.updates b{font-family:var(--mono);color:var(--amber);font-size:.85rem}
/* PROJECTS */
.paper{background:var(--paper);color:#241b14;min-height:80vh}
.paper a{color:var(--burg)}
.paper .tape{background:var(--burg);color:var(--cream)}
.pj{display:grid;grid-template-columns:1.1fr 1fr;gap:26px;padding:30px 0;border-top:2px solid #241b14}
.pj:nth-of-type(even){direction:rtl}.pj:nth-of-type(even)>*{direction:ltr}
.art{min-height:200px;padding:20px;position:relative;display:flex;flex-direction:column;justify-content:center;gap:8px}
.art.rig{background:#0f1a14;color:#7ee0a3;font-family:var(--mono);font-size:.85rem;border:2px solid #7ee0a3;background-image:linear-gradient(#17301f 1px,transparent 1px),linear-gradient(90deg,#17301f 1px,transparent 1px);background-size:22px 22px}
.art.rig .n{border:1px solid #7ee0a3;padding:3px 8px;display:inline-block}.art.rig .w{border-color:#ff9d5c;color:#ff9d5c}
.art.mj{background:#c9a66b;color:#2a1a0c}
.art.mj div{background:#f6e9c8;padding:8px 12px;box-shadow:2px 3px 0 rgba(0,0,0,.25);font-family:var(--mono);font-size:.82rem}
.art.mj div:nth-child(1){transform:rotate(-2deg)}.art.mj div:nth-child(2){transform:rotate(1.5deg);margin-left:24px}.art.mj div:nth-child(3){transform:rotate(-1deg)}
.art.led{background:#fbf6e8;border:1px solid #241b14;font-family:var(--mono);font-size:.82rem;background-image:repeating-linear-gradient(transparent 0 25px,#9bb7d4 25px 26px)}
.art.os{background:var(--navy);color:var(--cream)}
.phone{width:150px;height:200px;border:5px solid var(--char);border-radius:22px;background:var(--ink);padding:12px;margin:0 auto;font-family:var(--mono);font-size:.7rem;display:grid;gap:6px;align-content:start}
.phone i{display:block;background:var(--burg);height:16px;border-radius:4px}.phone i:nth-child(2){background:var(--amber)}
.art.cam{background:#111;color:#fff;border:2px solid #333;font-family:var(--mono)}
.art.cam::before{content:"";position:absolute;inset:18px;border:2px solid rgba(255,255,255,.7);clip-path:polygon(0 0,18% 0,18% 3px,3px 3px,3px 18%,0 18%,0 0)}
.art.cam .rec{color:#ff4b4b}
.pj h3{font-size:1.8rem;margin:4px 0 8px}
.stk{font-family:var(--mono);font-size:.8rem;opacity:.85}
.lk{margin-top:10px;font-family:var(--mono);font-weight:700}.lk a{margin-right:16px}
/* MUSIC */
.crates{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0}
.crates button{font-family:var(--mono);font-weight:700;background:var(--char);color:var(--cream);border:2px solid var(--burg);padding:9px 14px;cursor:pointer;font-size:.9rem}
.crates button[aria-pressed=true]{background:var(--amber);color:var(--ink);border-color:var(--amber)}
.sleeves{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:18px}
.sl{aspect-ratio:1;padding:14px;display:flex;flex-direction:column;justify-content:space-between;color:#fff;box-shadow:5px 5px 0 rgba(0,0,0,.5);transition:transform .2s;position:relative;overflow:hidden}
.sl:hover{transform:rotate(-2deg) translateY(-4px)}
.sl::after{content:"";position:absolute;right:-30px;bottom:-30px;width:110px;height:110px;border-radius:50%;background:repeating-radial-gradient(#0003 0 2px,#0000 2px 5px);}
.sl b{font-family:var(--disp);font-weight:400;font-size:1.25rem;line-height:1.05}
.sl small{font-family:var(--mono);font-size:.75rem}
.shuf{margin:24px 0;padding:16px;border:2px dashed var(--amber)}
/* LINKS */
.bk{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;margin:22px 0 40px}
.bk a{display:block;text-decoration:none;color:var(--cream);border:2px solid var(--burg);background:var(--char);padding:14px 16px;transition:transform .2s,border-color .2s}
.bk a:hover{transform:rotate(-1.5deg) translateY(-3px);border-color:var(--amber)}
.bk b{font-family:var(--disp);font-weight:400;font-size:1.25rem;color:var(--amber);display:block}
.bk small{font-family:var(--mono);font-size:.8rem}
.btn88{display:inline-block;width:88px;height:31px;line-height:27px;text-align:center;font-family:var(--mono);font-weight:700;font-size:.72rem;border:2px outset var(--amber);color:var(--ink);background:var(--amber);text-decoration:none;margin:0 6px 8px 0}
.btn88:hover{background:var(--cream)}
.heroes{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:18px;margin-top:18px}
.card{background:var(--cream);color:#241b14;padding:16px;border:3px solid #241b14;box-shadow:5px 5px 0 rgba(0,0,0,.5);min-height:170px;display:flex;flex-direction:column;justify-content:space-between;transition:transform .2s}
.card:nth-child(odd){transform:rotate(-1.2deg)}.card:nth-child(even){transform:rotate(1.2deg)}
.card:hover{transform:rotate(0) scale(1.04)}
.card b{font-family:var(--disp);font-weight:400;font-size:1.4rem;line-height:1.05}
.card small{font-family:var(--mono);font-weight:700;color:var(--burg)}
/* GUESTBOOK */
.gf{display:grid;gap:10px;max-width:520px;margin:22px 0 34px;border:2px solid var(--burg);background:var(--char);padding:18px}
.gf label{font-family:var(--mono);font-weight:700;font-size:.85rem}
.gf input,.gf textarea{font:inherit;padding:10px;background:var(--ink);color:var(--cream);border:2px solid var(--burg);width:100%}
.gf textarea{min-height:110px;resize:vertical}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.gb{background:var(--cream);color:#241b14;padding:14px 18px;margin-bottom:14px;border-left:8px solid var(--amber);box-shadow:4px 4px 0 rgba(0,0,0,.5);max-width:620px;overflow-wrap:anywhere}
.gb b{font-family:var(--disp);font-weight:400;margin-right:10px}.gb time{font-family:var(--mono);font-size:.78rem;color:var(--burg)}
/* JOURNAL */
.jn{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:26px;margin-top:6px}
.entry{background:var(--cream);color:#241b14;padding:22px;box-shadow:6px 6px 0 rgba(0,0,0,.5);border-top:10px solid var(--burg)}
.entry:nth-child(3n+2){transform:rotate(1deg);border-top-color:var(--amber)}
.entry:nth-child(3n){transform:rotate(-.8deg);border-top-color:var(--navy)}
.entry time{font-family:var(--mono);font-size:.8rem;font-weight:700;color:var(--burg)}
.entry h2{margin:6px 0 10px;font-size:1.35rem}
.entry p{margin-bottom:10px}
.entry ul{margin:0 0 10px 20px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.tags span{font-family:var(--mono);font-size:.74rem;border:1.5px solid #241b14;padding:1px 8px}
/* ABOUT */
.ab{display:grid;grid-template-columns:1.5fr 1fr;gap:36px;margin-top:26px}
.ab p{margin-bottom:16px;max-width:58ch}
.ab p.lede{font-size:1.45rem;font-style:italic;line-height:1.4}
.ab p.lede::first-letter{font-family:var(--disp);font-size:3.4rem;float:left;line-height:.85;padding:4px 8px 0 0;color:var(--burg)}
.fact{background:var(--cream);border:2px solid #241b14;padding:18px;transform:rotate(1.2deg);box-shadow:5px 5px 0 rgba(36,27,20,.35);align-self:start}
.fact h3{font-size:1.1rem;color:var(--burg);margin-bottom:10px}
.fact dt{font-family:var(--mono);font-weight:700;font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--burg);margin-top:12px}
.fact dd{margin:0}
.faq{margin-top:34px;border-top:2px solid #241b14;padding-top:20px;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px}
.faq h3{font-size:1.05rem;margin-bottom:6px;color:var(--burg)}
@media(max-width:820px){.ab{grid-template-columns:1fr}}
/* CONTACT */
.ct{max-width:640px}
.ct .mail{font-family:var(--disp);font-size:clamp(1.3rem,4.5vw,2.2rem);word-break:break-all}
.ct li{list-style:none;padding:12px 0;border-bottom:2px dotted #241b14;font-family:var(--mono);font-weight:700}
footer{padding:20px 22px calc(30px + env(safe-area-inset-bottom));font-family:var(--mono);font-size:.8rem;border-top:3px double var(--burg);color:#999}
#egg{position:fixed;bottom:16px;right:16px;background:var(--amber);color:var(--ink);padding:10px 14px;font-family:var(--mono);font-weight:700;transform:rotate(-3deg);display:none;z-index:40}
@media(max-width:820px){.home,.pj{grid-template-columns:1fr}.pj:nth-of-type(even){direction:ltr}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head>

 <h2>Heroes</h2><div class="heroes">${HEROES.map(h=>`<div class="card"><small>${h[1]}</small><b>${h[0]}</b><small>${h[2]}</small></div>`).join('')}</div>
 <h2 style="margin-top:40px">Grab my button</h2><p class="mono" style="margin-bottom:10px">88x31, because some traditions deserve to live.</p>
 <a class="btn88" href="#/">NIKH.EXE</a></div>`},
 guestbook(){return `<div class="wrap"><span class="tape">SIGN HERE</span><h1>Guestbook</h1><p style="max-width:55ch;margin-top:10px">Leave a message. I read every one, and approve them by hand before they show up here.</p>
 <form class="gf" id="gf"><label for="gn">Name</label><input id="gn" name="nm" maxlength="40" required autocomplete="nickname">
 <label for="gmsg">Message (500 characters max)</label><textarea id="gmsg" name="msg" maxlength="500" required></textarea>
 <div class="hp" aria-hidden="true"><label>Leave this empty<input name="website" tabindex="-1" autocomplete="off"></label></div>
 <button class="btn" type="submit">Sign it</button><p class="mono" id="gm" role="status"></p></form>
 <div id="gl" aria-live="polite">Loading...</div></div>`},
 journal(){const tags=[...new Set(JOURNAL.flatMap(j=>j.tags))];return `<div class="wrap"><span class="tape">THE ZINE</span><h1>Journal</h1><p style="max-width:55ch;margin-top:10px">Things I'm learning, things I think, and the occasional rant. Newest first.</p>
 <div class="crates" role="group" aria-label="Filter by tag"><button data-t="" aria-pressed="true">all</button>${tags.map(t=>`<button data-t="${t}" aria-pressed="false">${t}</button>`).join('')}</div>
 <div class="jn" id="jn"></div></div>`},
 about(){return `<div class="paper"><div class="wrap"><span class="tape">THE LIQUOR-FREE INTERVIEW</span><h1>Who even is this guy</h1>
 <div class="ab"><div>
 <p class="lede">By day I keep banking systems running. By night I build things that nobody asked for, usually with more care than the situation strictly requires.</p>
 <p>I'm Nikhiel, but everyone calls me Nikh. I live in Suriname and work as an IT Operator at a fintech banking environment, which means I spend a lot of time making sure things work, and an even more suspicious amount of time wondering what happens when they stop working. I can't tell you the details, because banks get weird about that, but it has shaped how I think about software.</p>
 <p>I'm also studying BSc IT / Software Engineering at UNASAT, heading toward backend work. Java, Spring Boot, PostgreSQL, authentication, security. I like the parts of an app that users never see and absolutely notice when they're wrong.</p>
 <p>I'm not a ten-year veteran, and I'm not going to pretend. I'm early in my career, learning properly, and building real things along the way. My rule: I don't collect frameworks. I'd rather understand one system all the way down than skim ten tutorials.</p>
 <p>Outside the screen, I'm the guy with kompa on, an anime half-watched and a horror movie queued up. Yes, those can all happen in the same evening. This site is the proof.</p></div>
 <aside class="fact"><h3>FIELD NOTES</h3><dl>
 <dt>Day job</dt><dd>IT Operator, fintech banking</dd>
 <dt>School</dt><dd>BSc IT / Software Eng., UNASAT</dd>
 <dt>Heading toward</dt><dd>Backend engineering</dd>
 <dt>Base</dt><dd>Suriname</dd>
 <dt>Soundtrack</dt><dd>Kompa, zouk, salsa, reggae, alt rock, opera, jazz</dd>
 <dt>Screens</dt><dd>Bebop, GTO, Hunter x Hunter, Inuyasha, Dragon Ball Super</dd>
 <dt>Controllers</dt><dd>Zelda, Stardew, Assassin's Creed, Mario Odyssey</dd>
 <dt>Horror</dt><dd>Yes. Halloween is a comfort film. Don't ask.</dd></dl></aside></div>
 <div class="faq"><div><h3>Frequently asked, by nobody</h3><p>Why a personal site instead of a normal portfolio? Because I wanted a place that feels like mine, with the projects in one room of it.</p></div>
 <div><h3>Do you do jazz only?</h3><p>No. Jazz is the late-night shelf. The rest of the collection gets loud and goes to a party.</p></div>
 <div><h3>Open to work?</h3><p>Open to interesting things. Email me and we'll see.</p></div></div></div></div>`},
 contact(){return `<div class="paper"><div class="wrap ct"><span class="tape">OPEN CHANNEL</span><h1>Say hello</h1><p style="margin:12px 0 22px">Got something interesting to build, or just want to talk music or backend? Email is fastest.</p>
 <a class="mail" href="mailto:${ME.email}">${ME.email}</a><ul style="margin-top:28px">
 <li><a href="${ME.github}" target="_blank" rel="noopener">GitHub ↗</a></li><li><a href="${ME.linkedin}" target="_blank" rel="noopener">LinkedIn ↗</a></li><li><a href="${ME.site}" target="_blank" rel="noopener">nikhcodes.github.io ↗</a></li>
 ${ME.resume?`<li><a href="${ME.resume}" target="_blank" rel="noopener">Résumé ↗</a></li>`:''}</ul></div></div>`}
};
const nav=[["home","Home"],["about","About"],["projects","Projects"],["journal","Journal"],["links","Links"],["guestbook","Guestbook"],["music","Music"],["contact","Contact"]];
function render(){const r=(location.hash.replace('#/','')||'home');const k=pages[r]?r:'home';
 v.innerHTML=pages[k]();document.title=(k=='home'?"NIKH.EXE | Under Construction Forever":nav.find(n=>n[0]==k)[1]+" · NIKH.EXE");window.scrollTo(0,0);
 $('#nav').innerHTML=nav.map(n=>`<a href="#/${n[0]=='home'?'':n[0]}" ${n[0]==k?'aria-current="page"':''}>${n[1]}</a>`).join('');
 if(k=='home'){$('#sh').onclick=()=>{$('#pick').textContent=ME.picks[Math.floor(Math.random()*ME.picks.length)]}}
 if(k=='guestbook'){const L=$('#gl'),M=$('#gm');
 fetch('/api/guestbook').then(r=>{if(!r.ok)throw 0;return r.json()}).then(d=>{L.textContent='';if(!d.entries.length){L.textContent='No signatures yet. Be the first.';return}d.entries.forEach(e=>{const a=document.createElement('article');a.className='gb';const b=document.createElement('b');b.textContent=e.name;const t=document.createElement('time');t.textContent=new Date(e.created_at).toLocaleDateString();const p=document.createElement('p');p.textContent=e.message;a.append(b,t,p);L.append(a)})}).catch(()=>{L.textContent='The guestbook is offline here. It only works once the site is deployed with its backend.';$('#gf').hidden=true});
 $('#gf').onsubmit=async ev=>{ev.preventDefault();const f=ev.target;M.textContent='Sending...';try{const r=await fetch('/api/guestbook',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({nm:f.elements.nm.value,msg:f.elements.msg.value,website:f.elements.website.value})});const d=await r.json().catch(()=>({}));if(r.ok){f.reset();M.textContent='Thanks! Your message shows up once I approve it.'}else M.textContent=d.error||'Something went wrong.'}catch(e){M.textContent='Could not reach the guestbook.'}}}
 if(k=='journal'){const show=t=>{$('#jn').innerHTML=JOURNAL.filter(j=>!t||j.tags.includes(t)).map(j=>`<article class="entry"><time>${j.d}</time><h2>${j.t}</h2>${j.body}<div class="tags">${j.tags.map(x=>`<span>${x}</span>`).join('')}</div></article>`).join('');document.querySelectorAll('.crates button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.t==t))};show('');document.querySelectorAll('.crates button').forEach(b=>b.onclick=()=>show(b.dataset.t))}
 if(k=='music'){const draw=n=>{const c=CRATES[n];$('#sl').innerHTML=c.items.map(i=>`<div class="sl" style="background:${c.c}"><small>${i[1]}</small><b>${i[0]}</b><small>${i[2]}</small></div>`).join('');document.querySelectorAll('.crates button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.c==n))};
  draw(Object.keys(CRATES)[0]);document.querySelectorAll('.crates button').forEach(b=>b.onclick=()=>draw(b.dataset.c));
  $('#msh').onclick=()=>{const all=Object.entries(CRATES).flatMap(([g,c])=>c.items.map(i=>[g,i[0]]));const p=all[Math.floor(Math.random()*all.length)];$('#mp').textContent=`Try: ${p[1]} (${p[0]})`}}}
addEventListener('hashchange',render);render();
