<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<base href="/">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<!-- meta -->
<title>Nikhiel Lingard | NIKH.EXE</title>
<meta name="description" content="IT Operator by day, builder by night. Backend projects, a notebook, an arcade and a turntable, hand-built in Suriname.">
<meta property="og:type" content="website"><meta property="og:site_name" content="NIKH.EXE">
<meta property="og:title" content="Nikhiel Lingard | NIKH.EXE"><meta property="og:description" content="IT Operator by day, builder by night. Backend projects, a notebook, an arcade and a turntable, hand-built in Suriname.">

<link href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Courier+Prime:wght@400;700&family=Newsreader:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/reveal.css">
<style>
:root{--ink:#0d1018;--navy:#14213a;--char:#22252d;--burg:#6b1f2e;--red:#b8343f;--amber:#e0a458;--cream:#f1e7d3;--paper:#e6d9bd;--disp:'Bowlby One',Impact,sans-serif;--mono:'Courier Prime',ui-monospace,monospace;--serif:'Newsreader',Georgia,serif}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
html{background:var(--ink)}
body{font-family:var(--serif);font-size:1.08rem;line-height:1.6;color:var(--cream);background:var(--ink);overflow-x:hidden;min-height:100vh;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
a{color:var(--amber)}
:focus-visible{outline:3px solid var(--amber);outline-offset:3px}
.mono{font-family:var(--mono)}
header{display:flex;flex-wrap:wrap;align-items:center;gap:8px 22px;padding:14px 22px;border-bottom:3px double var(--burg);background:var(--char);position:sticky;top:0;z-index:20}
.logo{font-family:var(--disp);font-size:1.15rem;color:var(--amber);text-decoration:none;transform:rotate(-1.5deg);display:inline-block}
nav{display:flex;flex-wrap:wrap;gap:4px}
nav a{font-family:var(--mono);font-weight:700;text-decoration:none;color:var(--cream);padding:8px 12px;border:2px solid transparent;font-size:.9rem}
nav a:hover{border-color:var(--amber);transform:rotate(-2deg)}
nav a[aria-current=page]{background:var(--amber);color:var(--ink);transform:rotate(-2deg)}
#view{animation:in .35s ease}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
.wrap{max-width:1100px;margin:0 auto;padding:34px 22px 60px}
h1,h2,h3{font-family:var(--disp);font-weight:400;line-height:1.05}
h1{font-size:clamp(2.4rem,7vw,4.8rem)}
h2{font-size:1.6rem;margin-bottom:12px}
.tape{display:inline-block;background:rgba(224,164,88,.85);color:var(--ink);font-family:var(--mono);font-weight:700;font-size:.8rem;padding:3px 14px;transform:rotate(-3deg)}
/* HOME */
.home{display:grid;grid-template-columns:290px 1fr;gap:28px}
.side{display:grid;gap:18px;align-self:start}
.box{border:2px solid var(--burg);background:var(--char);padding:16px}
.box h3{font-family:var(--mono);font-weight:700;font-size:.8rem;letter-spacing:.1em;text-transform:uppercase;background:var(--burg);margin:-16px -16px 12px;padding:6px 16px}
.side .box{position:relative;border-color:#2f323b;padding-top:24px;margin-top:10px}
.side .box h3{position:absolute;top:-12px;left:12px;margin:0;padding:3px 12px;background:rgba(224,164,88,.88);color:var(--ink);letter-spacing:.06em;font-size:.75rem;transform:rotate(-2deg);box-shadow:1px 2px 0 rgba(0,0,0,.35)}
.side .box:nth-child(even) h3{transform:rotate(1.5deg);left:auto;right:12px}
.avatar{aspect-ratio:1;background:repeating-linear-gradient(45deg,var(--navy) 0 10px,var(--ink) 10px 20px);display:grid;place-items:center;font-family:var(--disp);font-size:3rem;color:var(--amber);border:2px solid var(--amber);margin-bottom:10px}
.status{font-family:var(--mono);color:var(--amber)}
.stick{position:relative;display:flex;flex-wrap:wrap;align-content:flex-start;gap:9px 7px;padding:16px 12px 18px;background:#3b3f47 linear-gradient(160deg,rgba(255,255,255,.09),transparent 45%);border-radius:10px;box-shadow:inset 0 0 0 2px #2a2d33,inset 0 -3px 0 #2a2d33}
.stick::after{content:"";position:absolute;left:50%;top:50%;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;background:rgba(241,231,211,.08);pointer-events:none}
.stick span{position:relative;z-index:1;font-family:var(--mono);font-weight:700;font-size:.78rem;padding:4px 10px;border-radius:999px;border:2px solid #f6f2ea;box-shadow:0 2px 0 rgba(0,0,0,.35);transition:transform .2s;color:var(--ink);background:var(--amber)}
.stick span:nth-child(5n+1){background:var(--amber);transform:rotate(-3deg)}
.stick span:nth-child(5n+2){background:var(--cream);transform:rotate(2deg);border-radius:4px}
.stick span:nth-child(5n+3){background:#b8343f;color:var(--cream);transform:rotate(-1deg)}
.stick span:nth-child(5n+4){background:#7fa3d1;transform:rotate(3deg);border-radius:4px}
.stick span:nth-child(5n){background:#7ee0a3;transform:rotate(-2deg)}
.stick span:hover{transform:rotate(0) scale(1.08)}
@media(prefers-reduced-motion:reduce){.stick span{transition:none}}
.hero p.big{font-size:1.5rem;font-style:italic;max-width:30ch;margin:16px 0}
.btn{display:inline-block;font-family:var(--mono);font-weight:700;padding:11px 18px;background:var(--amber);color:var(--ink);text-decoration:none;border:2px solid var(--amber);margin:4px 8px 4px 0;cursor:pointer;font-size:1rem}
.btn:hover{background:transparent;color:var(--amber)}
.btn.ghost{background:transparent;color:var(--amber)}
.btn.ghost:hover{background:var(--amber);color:var(--ink)}
.updates li{list-style:none;padding:6px 0;border-bottom:1px dotted var(--grey,#777)}
.updates b{font-family:var(--mono);color:var(--amber);font-size:.85rem}
/* PROJECTS */
.paper{background:var(--paper);color:#241b14;min-height:80vh}
.paper a{color:var(--burg)}
.paper .tape{background:var(--burg);color:var(--cream)}
.pj{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:44px;align-items:center;padding:46px 0}
.pj+.pj{border-top:2px dashed rgba(36,27,20,.3)}
.pj:nth-of-type(even) .mat{order:2}
/* the cutting mat each build sits on */
.mat{position:relative;background:#2c5844;border-radius:6px;padding:34px 30px 30px 38px;box-shadow:inset 0 0 0 2px rgba(0,0,0,.25),6px 7px 0 rgba(36,27,20,.25);
 background-image:linear-gradient(90deg,rgba(241,231,211,.55) 1px,transparent 1px),linear-gradient(rgba(241,231,211,.55) 1px,transparent 1px),linear-gradient(90deg,rgba(241,231,211,.13) 1px,transparent 1px),linear-gradient(rgba(241,231,211,.13) 1px,transparent 1px);
 background-size:100px 100%,100% 100px,20px 20px,20px 20px;background-position:38px 0,0 34px,38px 0,0 34px}
.mat::before,.mat::after{content:"";position:absolute;background-repeat:repeat;pointer-events:none}
.mat::before{left:38px;right:0;top:0;height:14px;background-image:linear-gradient(90deg,rgba(241,231,211,.7) 1px,transparent 1px),linear-gradient(90deg,rgba(241,231,211,.7) 1px,transparent 1px);background-size:100px 14px,10px 7px;background-repeat:repeat-x}
.mat::after{top:34px;bottom:0;left:0;width:14px;background-image:linear-gradient(rgba(241,231,211,.7) 1px,transparent 1px),linear-gradient(rgba(241,231,211,.7) 1px,transparent 1px);background-size:14px 100px,7px 10px;background-repeat:repeat-y}
.on-mat{position:relative;transform:rotate(var(--tilt));box-shadow:0 10px 18px rgba(0,0,0,.35)}
.on-mat::before,.on-mat::after{content:"";position:absolute;z-index:2;width:74px;height:20px;background:rgba(241,231,211,.78);box-shadow:0 1px 1px rgba(0,0,0,.15)}
.on-mat::before{top:-9px;left:-18px;transform:rotate(-38deg)}
.on-mat::after{bottom:-9px;right:-18px;transform:rotate(-38deg)}
.pj-desc{font-size:1.08rem;line-height:1.65;margin:0 0 16px}
/* stack as label-maker tape */
.dymo{list-style:none;margin:0 0 18px;padding:0;display:flex;flex-wrap:wrap;gap:8px 6px}
.dymo li{font-family:var(--mono);font-weight:700;font-size:.78rem;letter-spacing:.06em;color:#f2f2ee;background:linear-gradient(180deg,#2b2b2b,#141414 55%,#1d1d1d);padding:4px 10px 3px;border-radius:2px;text-shadow:0 1px 0 rgba(0,0,0,.9),0 -1px 0 rgba(255,255,255,.18);box-shadow:0 1px 0 rgba(0,0,0,.35)}
.dymo li:nth-child(3n+2){transform:rotate(-.8deg);background:linear-gradient(180deg,#8a2433,#6b1f2e 55%,#7a2232)}
.dymo li:nth-child(4n+3){transform:rotate(.7deg)}
.dymo li:nth-child(5n){background:linear-gradient(180deg,#26405f,#1b2f48 55%,#223955)}
.lk{display:flex;flex-wrap:wrap;gap:10px;margin:0;font-family:var(--mono);font-weight:700}
.lk a{text-decoration:none;padding:8px 14px;border:2px solid #241b14}
.paper .lk a.lk1{background:#241b14;color:var(--cream)}
.paper .lk a.lk2{color:#241b14}
.paper .lk a:hover{background:var(--burg);border-color:var(--burg);color:var(--cream)}
.paper .lk a:focus-visible{outline:3px solid var(--burg);outline-offset:3px}
@media(max-width:820px){.pj{grid-template-columns:1fr;gap:26px;padding:34px 0}.pj:nth-of-type(even) .mat{order:0}.mat{padding:26px 18px 22px 30px;background-position:30px 0,0 26px,30px 0,0 26px}.mat::before{left:30px}.mat::after{top:26px}}
.art{min-height:200px;padding:20px;position:relative;display:flex;flex-direction:column;justify-content:center;gap:8px}
.art.rig{background:#0f1a14;color:#7ee0a3;font-family:var(--mono);font-size:.85rem;border:2px solid #7ee0a3;background-image:linear-gradient(#17301f 1px,transparent 1px),linear-gradient(90deg,#17301f 1px,transparent 1px);background-size:22px 22px}
.art.rig .n{border:1px solid #7ee0a3;padding:3px 8px;display:inline-block}
.art.rig .w{border-color:#ff9d5c;color:#ff9d5c}
.art.mj{background:#c9a66b;color:#2a1a0c}
.art.mj div{background:#f6e9c8;padding:8px 12px;box-shadow:2px 3px 0 rgba(0,0,0,.25);font-family:var(--mono);font-size:.82rem}
.art.mj div:nth-child(1){transform:rotate(-2deg)}
.art.mj div:nth-child(2){transform:rotate(1.5deg);margin-left:24px}
.art.mj div:nth-child(3){transform:rotate(-1deg)}
.art.led{background:#fbf6e8;border:1px solid #241b14;font-family:var(--mono);font-size:.82rem;background-image:repeating-linear-gradient(transparent 0 25px,#9bb7d4 25px 26px)}
.art.os{background:var(--navy);color:var(--cream)}
.phone{width:150px;height:200px;border:5px solid var(--char);border-radius:22px;background:var(--ink);padding:12px;margin:0 auto;font-family:var(--mono);font-size:.7rem;display:grid;gap:6px;align-content:start}
.phone i{display:block;background:var(--burg);height:16px;border-radius:4px}
.phone i:nth-child(2){background:var(--amber)}
.art.cam{background:#111;color:#fff;border:2px solid #333;font-family:var(--mono)}
.art.cam::before{content:"";position:absolute;inset:18px;border:2px solid rgba(255,255,255,.7);clip-path:polygon(0 0,18% 0,18% 3px,3px 3px,3px 18%,0 18%,0 0)}
.art.cam .rec{color:#ff4b4b}
.pj h3{font-size:clamp(1.9rem,4vw,2.6rem);line-height:1;margin:8px 0 12px}
/* MUSIC: a record crate */
.dividers{display:flex;flex-wrap:wrap;gap:4px 6px;margin:26px 0 0;padding-left:8px}
.dividers button{font-family:var(--mono);font-weight:700;font-size:.85rem;background:#e9dcc0;color:#241b14;border:2px solid #241b14;border-bottom:0;padding:7px 14px 9px;border-radius:8px 8px 0 0;cursor:pointer;transform:translateY(6px);box-shadow:inset 0 -6px 0 var(--c)}
.dividers button[aria-selected=true]{background:var(--cream);transform:translateY(0);box-shadow:inset 0 -6px 0 var(--c),0 -2px 0 var(--c)}
.dividers button:hover{transform:translateY(2px)}.dividers button[aria-selected=true]:hover{transform:none}
.crate{position:relative;border:3px solid #241b14;border-top-width:2px;background:#3a2617 repeating-linear-gradient(90deg,rgba(0,0,0,.18) 0 2px,transparent 2px 90px);overflow-x:auto;overflow-y:hidden;scrollbar-width:thin;padding:40px 14px 0}
.spines{position:relative;display:flex;align-items:flex-end;gap:3px;min-height:236px;min-width:max-content;padding:0 6px}
.spines::after{content:"";position:absolute;left:-14px;right:-14px;bottom:0;height:64px;background:#4b3120 repeating-linear-gradient(0deg,rgba(0,0,0,.12) 0 1px,transparent 1px 7px);border-top:3px solid #241b14;box-shadow:0 -6px 10px rgba(0,0,0,.35);pointer-events:none;z-index:3}
.spine{position:relative;flex:0 0 var(--w);height:226px;background:var(--c) center/cover;filter:brightness(calc(1 - var(--shade)*.12));border:1px solid rgba(0,0,0,.45);border-radius:2px 2px 0 0;color:var(--cream);cursor:pointer;padding:10px 0 70px;transform:rotate(var(--lean));transform-origin:bottom center;transition:transform .25s ease-out,filter .2s;box-shadow:inset -4px 0 0 rgba(0,0,0,.18),inset 3px 0 0 rgba(255,255,255,.08)}
.spine span{display:block;writing-mode:vertical-rl;transform:rotate(180deg);font-family:var(--disp);font-size:.95rem;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-height:146px;margin:0 auto;text-shadow:0 1px 2px rgba(0,0,0,.5)}
.spine:hover{transform:rotate(0) translateY(-10px);filter:brightness(1.08)}
.spine.out{transform:rotate(0) translateY(-36px);filter:brightness(1.15);z-index:2}
.spine:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.crate-empty{color:var(--cream);font-family:var(--mono);padding:30px 10px 90px}
.pulled{display:grid;grid-template-columns:minmax(220px,340px) 1fr;gap:clamp(60px,12vw,160px);align-items:center;margin:34px 0 10px;min-height:260px}
.record{position:relative;width:100%;max-width:340px;aspect-ratio:1}
.sleeve{position:absolute;inset:0;z-index:1;background:var(--c);border:2px solid #241b14;box-shadow:6px 6px 0 rgba(0,0,0,.45);overflow:hidden;display:grid;place-items:end start;padding:16px}
.sleeve img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.sleeve-type{font-family:var(--disp);font-size:clamp(1.4rem,4vw,2.2rem);line-height:.95;color:var(--cream);max-width:9ch;overflow-wrap:anywhere}
.vinyl{position:absolute;top:4%;left:4%;width:92%;height:92%;border-radius:50%;background:#111 repeating-radial-gradient(circle,#1b1b1b 0 1px,#0c0c0c 1px 3px);box-shadow:0 0 0 2px #000;transition:transform .6s cubic-bezier(.2,.8,.25,1)}
.vinyl span{position:absolute;inset:34%;border-radius:50%;background:var(--c);box-shadow:inset 0 0 0 3px rgba(0,0,0,.25)}
.vinyl span::after{content:"";position:absolute;inset:44%;border-radius:50%;background:#0c0c0c}
.record.slid .vinyl{transform:translateX(38%)}
.liner{max-width:52ch;padding-left:4px}
.liner-label{display:flex;flex-wrap:wrap;gap:4px 14px;font-family:var(--mono);font-weight:700;font-size:.85rem;color:var(--amber);margin:0}
.liner-label span{color:#999;font-weight:400}
.liner h2{font-size:clamp(1.8rem,4.5vw,2.8rem);margin:6px 0 12px;line-height:1}
.liner-note{font-size:1.15rem;line-height:1.6;font-style:italic;margin:0 0 14px}
.liner .listen{font-size:.95rem;gap:8px 16px}
.liner .listen .play{padding:7px 14px}
.dig{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;margin:26px 0 0}
.dig .btn{margin:0}
.dig .mono{font-size:.8rem;opacity:.7}
@media(max-width:720px){.pulled{grid-template-columns:1fr;gap:22px}.record{max-width:250px}.record.slid .vinyl{transform:translateX(28%)}.spines{min-height:206px}.spine{height:196px}}
/* LINKS */
.bk{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;margin:22px 0 40px}
.bk a{display:block;text-decoration:none;color:var(--cream);border:2px solid var(--burg);background:var(--char);padding:14px 16px;transition:transform .2s,border-color .2s}
.bk a:hover{transform:rotate(-1.5deg) translateY(-3px);border-color:var(--amber)}
.bk b{font-family:var(--disp);font-weight:400;font-size:1.25rem;color:var(--amber);display:block}
.bk small{font-family:var(--mono);font-size:.8rem}
.heroes{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:18px;margin-top:18px}
.card{--mx:50%;--my:50%;position:relative;background:var(--cream);color:#241b14;padding:12px 12px 14px;border:3px solid #241b14;outline:4px solid var(--cream);outline-offset:-10px;box-shadow:5px 5px 0 rgba(0,0,0,.5);min-height:170px;display:flex;flex-direction:column;gap:6px;transition:transform .25s ease-out;overflow:hidden;min-width:0}
.card:nth-child(odd){transform:rotate(-1.2deg)}
.card:nth-child(even){transform:rotate(1.2deg)}
.card:hover,.card:focus-visible{transition:transform .08s linear}
.card:focus-visible{transform:rotate(0) scale(1.03)}
.card b{font-family:var(--disp);font-weight:400;font-size:1.4rem;line-height:1.05;overflow-wrap:anywhere;hyphens:auto}
.card b.long{font-size:1.15rem}
.card b.xlong{font-size:1rem}
.card small{font-family:var(--mono);font-weight:700;color:var(--burg)}
.card-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-family:var(--mono);font-size:.72rem}
.card-no{font-family:var(--mono);font-size:.7rem;font-weight:700;opacity:.65}
.card .flavor{margin:0;font-style:italic;font-size:.95rem;line-height:1.35;border-top:1.5px solid rgba(36,27,20,.35);padding-top:6px}
.card-rare{margin-top:auto;align-self:flex-end;font-family:var(--mono);font-size:.68rem;font-weight:700;background:#241b14;color:var(--amber);padding:1px 7px}
.card.holo::after{content:"";position:absolute;inset:0;pointer-events:none;mix-blend-mode:color-dodge;opacity:0;transition:opacity .25s;
 background:radial-gradient(circle at var(--mx) var(--my),rgba(255,255,255,.55),transparent 38%),linear-gradient(115deg,transparent 20%,rgba(224,164,88,.35) 35%,rgba(126,224,163,.3) 48%,rgba(207,218,230,.35) 60%,transparent 75%);background-size:100% 100%,250% 250%;background-position:center,var(--mx) var(--my)}
.card.holo:hover::after,.card.holo:focus-visible::after{opacity:.45}
/* BROWSER WINDOW (links) */
.bw{margin:22px 0 40px;border:2px solid #241b14;background:var(--char);box-shadow:8px 8px 0 rgba(0,0,0,.45);overflow:hidden}
.bw-bar{display:flex;align-items:flex-end;gap:10px;background:#15171d;padding:8px 10px 0}
.bw-dots{display:flex;gap:6px;padding-bottom:12px;flex:0 0 auto}
.bw-dots i{width:11px;height:11px;border-radius:50%;background:var(--red)}.bw-dots i:nth-child(2){background:var(--amber)}.bw-dots i:nth-child(3){background:#7ee0a3}
.bw-tabs{display:flex;align-items:flex-end;gap:2px;overflow-x:auto;scrollbar-width:thin;min-width:0}
.bw-tab{display:flex;align-items:center;gap:7px;min-width:0;max-width:190px;flex:0 0 auto;padding:8px 10px;background:#22252d;color:#b9ae9c;border:1px solid #2f323b;border-bottom:0;font-family:var(--mono);font-weight:700;font-size:.82rem;cursor:pointer;border-radius:6px 6px 0 0}
.bw-tab[aria-selected=true]{background:var(--cream);color:#241b14;border-color:var(--cream)}
.bw-tab:hover{color:var(--cream)}.bw-tab[aria-selected=true]:hover{color:#241b14}
.bw-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fav{display:grid;place-items:center;width:16px;height:16px;flex:0 0 16px;border-radius:3px;color:#fff;font-size:.68rem;font-family:var(--mono)}
.bw-x{opacity:.45;font-weight:400}
.bw-plus{padding:6px 10px;color:#777;font-family:var(--mono)}
.bw-addr{display:flex;gap:12px;align-items:center;background:var(--cream);color:#241b14;padding:8px 12px;font-family:var(--mono);font-size:.82rem;border-bottom:1px solid rgba(36,27,20,.25)}
.bw-url{flex:1;min-width:0;background:#fbf6e8;border:1px solid rgba(36,27,20,.3);border-radius:14px;padding:3px 12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bw-page{background:#fbf6e8;color:#241b14;padding:26px 24px;min-height:190px;background-image:radial-gradient(rgba(36,27,20,.07) 1px,transparent 1.5px);background-size:16px 16px}
.bw-page h3{font-family:var(--disp);font-weight:400;font-size:clamp(1.6rem,4vw,2.4rem);margin:2px 0 6px}
.bw-host{font-family:var(--mono);font-size:.78rem;font-weight:700;color:var(--burg);margin:0}
.bw-note{font-style:italic;font-size:1.15rem;margin:0 0 16px;max-width:50ch}
.bw-page .btn{margin:0}
.bw-status{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 16px;background:#15171d;color:#999;font-family:var(--mono);font-size:.72rem;padding:5px 12px}
.grab{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px}

 background-image:repeating-linear-gradient(0deg,rgba(255,255,255,.04) 0 2px,transparent 2px 7px),repeating-linear-gradient(90deg,rgba(0,0,0,.035) 0 1px,transparent 1px 5px)}

.sb-empty{font-family:var(--mono);margin:0 0 28px;color:#fbf6e8}
/* the viewer */
.sbv{margin:auto;max-height:94vh;overflow:auto;border:0;padding:0;background:#fbf8f1;color:#241b14;max-width:min(980px,94vw);width:100%;box-shadow:10px 12px 0 rgba(0,0,0,.4)}
.sbv::backdrop{background:rgba(13,16,24,.82)}
.sbv-body{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(220px,1fr)}
.sbv figure{margin:0;background:#141414;display:grid;place-items:center;min-height:260px}
.sbv figure img{display:block;max-width:100%;max-height:78vh;width:auto;height:auto}
.sbv figcaption{color:#ddd;font-size:.95rem;padding:8px 12px}
.sbv-text{padding:26px 24px}
.sbv-text time{font-family:var(--mono);font-size:.8rem;font-weight:700;color:var(--burg)}
.sbv-text h2{font-size:1.6rem;margin:6px 0 10px;line-height:1.05}
.sbv-text p{white-space:pre-wrap;line-height:1.6}
.sbv-nav{display:flex;align-items:center;gap:10px;margin-top:18px;font-family:var(--mono);font-size:.85rem}
.sbv-nav .btn{margin:0;padding:6px 12px;font-size:.85rem;color:#241b14;border-color:#241b14}
.sbv-nav .btn:hover{background:#241b14;color:var(--cream)}
.sbv-x{position:absolute;top:8px;right:8px;z-index:2;width:38px;height:38px;border:0;background:#241b14;color:var(--cream);font-size:1.5rem;line-height:1;cursor:pointer}
.sbv-x:focus-visible{outline:3px solid var(--amber)}
@media(max-width:720px){.shoebox{padding:34px 16px 6px}.sbv-body{grid-template-columns:1fr}.sbv figure img{max-height:60vh}}
/* HOME EXTRAS */
.avatar.photo{position:relative;background:#000;overflow:hidden;padding:0}
.avatar.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity .25s}
.avatar.photo img.alt{opacity:0}
.avatar.swap:hover img.alt,.avatar.swap:focus img.alt,.avatar.swap.on img.alt{opacity:1}
.late{font-family:var(--mono);font-size:.8rem;color:var(--cream);opacity:.8;margin-top:8px;border-left:3px solid var(--amber);padding-left:8px}
.nl{display:flex;gap:12px;align-items:flex-start}
.nl .cover{width:64px;height:64px;object-fit:cover;flex:0 0 64px;border:2px solid var(--amber);transform:rotate(-2deg)}
.listen{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:8px;font-family:var(--mono);font-weight:700;font-size:.85rem;position:relative;z-index:1}
.listen a{color:inherit}
.listen .play{font:inherit;background:var(--amber);color:var(--ink);border:0;padding:3px 9px;cursor:pointer}
.listen .play:hover{background:var(--cream)}
.fridge-box{background:var(--char)}
.fridge{background:#f3dca8;color:#241b14;padding:12px 14px;transform:rotate(1.2deg);box-shadow:3px 3px 0 rgba(0,0,0,.45);white-space:pre-wrap;font-style:italic;position:relative}
.fridge::before{content:"";position:absolute;top:-6px;left:50%;width:30px;height:12px;margin-left:-15px;background:var(--red);border-radius:3px;box-shadow:0 2px 2px rgba(0,0,0,.4)}
.odo{display:flex;gap:3px;justify-content:center;margin:4px 0}
.odo span{font-family:var(--mono);font-weight:700;font-size:1.4rem;background:var(--ink);color:#7ee0a3;border:1px solid #2f323b;width:1.3em;text-align:center;line-height:1.5}
.odo-note{font-size:.72rem;text-align:center;opacity:.7}
/* MUSIC EXTRAS */
.player .frame iframe{display:block;width:100%;border:0;background:#000}
.player .frame.video{aspect-ratio:16/9}
.player .frame.video iframe{height:100%}
.player .small-note{font-size:.75rem;margin-top:8px;color:#241b14}
/* PROJECT PHOTO */
.art.photo{padding:0;background:#241b14;overflow:hidden}
.art.photo img{width:100%;height:100%;min-height:200px;object-fit:cover;display:block}
/* 404 */
.lost{text-align:center}
.lost img{display:block;margin:24px auto 0;max-width:min(80vw,368px);height:auto;image-rendering:pixelated}
.lost .big{font-size:1.3rem;font-style:italic;margin:16px auto 22px;max-width:40ch}
/* SOUND SWITCH */
.snd{font:inherit;background:transparent;color:#999;border:1px dashed #555;padding:4px 10px;cursor:pointer}
.snd[aria-pressed=true]{color:var(--amber);border-color:var(--amber)}
/* MOBILE NAV: one swipeable row instead of four wrapped lines */
@media(max-width:640px){
 header{flex-wrap:nowrap;gap:10px;padding:10px 0 10px 16px}
 header .logo{flex:0 0 auto}
 nav{flex-wrap:nowrap;overflow-x:auto;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding:4px 16px 4px 2px;mask-image:linear-gradient(90deg,transparent 0,#000 18px,#000 86%,transparent);-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 18px,#000 86%,transparent)}
 nav::-webkit-scrollbar{display:none}
 nav a{flex:0 0 auto;scroll-snap-align:start;padding:8px 10px}
}
/* PHOTO DROPS */
.drop-card{position:fixed;left:16px;bottom:16px;z-index:40;width:min(46vw,210px);margin:0;background:var(--cream);padding:8px 8px 6px;box-shadow:5px 6px 0 rgba(0,0,0,.5);transform:translateY(130%) rotate(-6deg);transition:transform .35s cubic-bezier(.2,.9,.3,1.2),width .25s}
.drop-card.in{transform:translateY(0) rotate(-3deg)}
.drop-card.big{width:min(86vw,420px)}
.drop-card img{display:block;width:100%;height:auto;max-height:230px;object-fit:cover;background:#241b14;cursor:zoom-in}
.drop-card.big img{max-height:70vh;object-fit:contain}
.drop-card.big img{cursor:zoom-out}
.drop-card figcaption{font-family:var(--mono);font-size:.78rem;font-weight:700;color:#241b14;text-align:center;padding-top:5px}
.drop-card::before{content:"";position:absolute;top:-9px;left:50%;width:60px;height:18px;margin-left:-30px;background:rgba(224,164,88,.8);transform:rotate(3deg)}
.drop-x{position:absolute;top:-12px;right:-12px;width:32px;height:32px;border-radius:50%;border:2px solid #241b14;background:var(--cream);color:#241b14;font-size:1.1rem;line-height:1;cursor:pointer;font-family:var(--mono)}
@media(prefers-reduced-motion:reduce){.drop-card{transition:none}}
/* ARCADE */
/* lobby: a row of cabinets standing on the arcade floor */
.floor{display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-end;gap:44px 28px;margin-top:34px;padding:0 6px}
.unit{flex:0 1 300px;position:relative;display:flex;flex-direction:column;background:#1b1d23;border:3px solid #05070b;border-bottom:10px solid #05070b;border-radius:12px 12px 0 0;padding:0 18px 18px;box-shadow:inset 7px 0 0 var(--g),inset -7px 0 0 var(--g),inset 10px 0 0 #05070b,inset -10px 0 0 #05070b}
.unit:nth-child(2){margin-bottom:0;padding-top:0}
.marquee{margin:0 -18px 16px;padding:16px 14px 14px;background:var(--g) radial-gradient(ellipse at 50% -20%,rgba(255,255,255,.55),transparent 65%);border-bottom:3px solid #05070b;border-radius:9px 9px 0 0;text-align:center}
.marquee h2{margin:0;font-size:1.45rem;line-height:1;color:#0d1018;text-shadow:0 1px 0 rgba(255,255,255,.3)}
.bezel{background:#05070b;padding:12px;border-radius:6px}
.crt{position:relative;aspect-ratio:4/3;border-radius:18px/14px;background:#0a1410 repeating-linear-gradient(0deg,rgba(126,224,163,.05) 0 1px,transparent 1px 3px);box-shadow:inset 0 0 28px rgba(0,0,0,.9);overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;padding:10px 12px;transition:filter .2s}
.unit:hover .crt,.unit:focus-within .crt{filter:brightness(1.35)}
.attract svg{display:block;width:100%;height:auto;max-height:110px}
.crt-board{list-style:none;margin:6px 0 0;padding:0;font-family:var(--mono);font-weight:700;font-size:.82rem;line-height:1.35;color:#7ee0a3;text-shadow:0 0 6px rgba(126,224,163,.55)}
.crt-board li:first-child{color:var(--amber);text-shadow:0 0 6px rgba(224,164,88,.6)}
.deck{display:flex;align-items:center;gap:12px;margin:16px -18px 0;padding:12px 26px;background:#2a2d35;border-top:3px solid #05070b;border-bottom:3px solid #05070b}
.joy{position:relative;width:18px;height:18px;border-radius:50%;background:#b8343f;box-shadow:0 2px 0 #6b1f2e;margin-right:14px}
.joy::after{content:"";position:absolute;left:7px;top:14px;width:4px;height:10px;background:#111}
.pbtn{width:16px;height:16px;border-radius:50%;background:var(--g);box-shadow:0 3px 0 rgba(0,0,0,.6)}
.unit-blurb{font-size:.98rem;line-height:1.5;margin:14px 0 16px;flex:1}
.coin{display:flex;align-items:center;gap:12px;align-self:center;font-family:var(--mono);font-weight:700;font-size:.95rem;color:var(--cream);background:#111318;border:2px solid #3a3d46;border-radius:4px;padding:10px 16px;cursor:pointer}
.coin .slot{width:5px;height:22px;border-radius:3px;background:#05070b;box-shadow:0 0 0 2px #3a3d46,0 0 8px 1px rgba(224,164,88,.35);transition:box-shadow .2s}
.coin:hover,.coin:focus-visible{border-color:var(--amber);color:var(--amber)}
.coin:hover .slot,.coin:focus-visible .slot{box-shadow:0 0 0 2px var(--amber),0 0 12px 3px rgba(224,164,88,.8)}
.coin:focus-visible{outline:3px solid var(--amber);outline-offset:3px}
@media(max-width:860px){.floor{flex-wrap:nowrap;justify-content:flex-start;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 6px 10px;scrollbar-width:thin}.unit{flex:0 0 min(280px,80%);scroll-snap-align:center}}
/* Terminal Typer */
.ty{font-family:var(--mono);background:#0a0f0c;border:1px solid #2f323b;padding:18px;max-width:640px;margin:0 auto;min-height:300px;display:flex;flex-direction:column;justify-content:flex-end;gap:10px}
.ty-hist{list-style:none;margin:0;padding:0;color:#3c5a4b;font-size:.9rem}
.ty-hist li::before{content:"✓ ";color:#4f9d69}
.ty-target{margin:8px 0 0;font-size:clamp(1rem,3.4vw,1.35rem);line-height:1.4;color:#5d7a6b;overflow-wrap:anywhere;min-height:1.4em}
.ty-ok{color:#7ee0a3}
.ty-next{color:var(--cream);text-decoration:underline;text-decoration-color:var(--amber);text-underline-offset:4px}
.ty-bad{color:#0d1018;background:#b8343f}
.ty-line{display:flex;align-items:center;gap:10px;border-top:1px dashed #2f323b;padding-top:12px}
.ty-ps{color:var(--amber);font-weight:700;font-size:.85rem;white-space:nowrap}
.ty-input{flex:1;min-width:0;background:transparent;border:0;border-bottom:2px solid #4f9d69;color:var(--cream);font:inherit;font-size:1.05rem;padding:4px 2px;outline:none;caret-color:var(--amber)}
.ty-input.typo{border-bottom-color:#b8343f}
.ty-input.shake{animation:tyshake .25s}
@keyframes tyshake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
@media(max-width:520px){.ty-ps{display:none}}
/* Rack Stack */
.rs-canvas{display:block;width:100%;max-width:360px;height:auto;aspect-ratio:3/4;margin:0 auto;border:1px solid #2f323b;touch-action:manipulation;cursor:pointer}
.rs-drop{display:block;margin:12px auto 0}
@media(prefers-reduced-motion:reduce){.ty-input.shake{animation:none}}
.cab-tag{font-family:var(--mono);font-weight:700;font-size:.78rem;color:var(--g,var(--amber))}
.cabinet{margin-top:24px;border:3px solid var(--g,var(--amber));background:var(--char);box-shadow:8px 8px 0 rgba(0,0,0,.4)}
.cab-head{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding:10px 14px;border-bottom:3px solid var(--g,var(--burg));background:linear-gradient(180deg,color-mix(in srgb,var(--g,#000) 22%,transparent),transparent)}
.cab-head h2{margin:0;flex:1;min-width:140px}
.cab-head .btn{margin:0;padding:6px 12px;font-size:.85rem}
.cab-body{display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:18px;padding:16px}
.hud{display:flex;flex-wrap:wrap;gap:6px 18px;font-family:var(--mono);font-weight:700;color:#7ee0a3;margin-bottom:8px}
.hud b{font-size:1.2rem}
.hud-lives{color:var(--red);letter-spacing:.15em}
.hud-info{margin-left:auto;color:var(--cream);opacity:.75}
.screen{position:relative;background:#0d1018;border:2px solid #2f323b;min-height:300px;padding:14px;background-image:repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 1px,transparent 1px 3px)}
.stage{outline:none}
.overlay{position:absolute;inset:0;background:rgba(13,16,24,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px;text-align:center;font-family:var(--mono)}
.overlay[hidden]{display:none}
.ov-big{font-family:var(--disp);font-size:clamp(1.6rem,5vw,2.4rem);color:var(--amber);margin:0}
.ov-score{font-weight:700;font-size:1.2rem;color:#7ee0a3;margin:0}
.ov-msg{min-height:1.4em;margin:0}
.ov-form{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;justify-content:center}
.ov-form label{display:grid;gap:6px;font-weight:700;font-size:.8rem;color:var(--cream)}
.initials{width:5.2ch;font-family:var(--mono);font-weight:700;font-size:2rem;letter-spacing:.35em;text-transform:uppercase;text-align:center;background:#000;color:var(--amber);border:2px solid var(--amber);padding:4px 0 4px .3em;border-radius:0}
.overlay .btn{margin:0}
.controls{font-family:var(--mono);font-size:.78rem;opacity:.75;margin:8px 0 0}
.side-board h3{font-family:var(--mono);font-size:.8rem;letter-spacing:.12em;color:var(--amber);margin:0 0 8px}
.hs{list-style:none;padding:0;margin:0;font-family:var(--mono);font-weight:700}
.hs li{display:grid;grid-template-columns:2.2em 3.4em 1fr;gap:4px;padding:4px 6px;border-bottom:1px dotted #3a3d46}
.hs li.me{background:var(--amber);color:var(--ink)}
.hs .hs-s{text-align:right}
.hs .hs-empty{display:block;opacity:.7;font-weight:400}
.ns-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:460px;margin:0 auto}
.srv{position:relative;display:grid;gap:4px;justify-items:start;padding:12px 10px;min-height:78px;background:#1a1d24;border:2px solid #2f323b;color:var(--cream);font-family:var(--mono);font-weight:700;cursor:pointer;text-align:left;touch-action:manipulation}
.srv .srv-name{font-size:.72rem;opacity:.7}
.srv .srv-state{font-size:.9rem}
.srv kbd{position:absolute;right:6px;top:6px;font-size:.65rem;opacity:.5}
.srv::after{content:"";position:absolute;right:8px;bottom:8px;width:10px;height:10px;border-radius:50%;background:#7ee0a3;box-shadow:0 0 8px #7ee0a3}
.srv.warn{border-color:var(--amber);color:var(--amber)}.srv.warn::after{background:var(--amber);box-shadow:0 0 10px var(--amber)}
.srv.crit{border-color:#ff5c5c;color:#ff8080;background:#2a1215}.srv.crit::after{background:#ff4b4b;box-shadow:0 0 12px #ff4b4b}
.srv.down{opacity:.45;border-style:dashed}.srv.down::after{background:#555;box-shadow:none}
.srv.ack{border-color:#7ee0a3;color:#7ee0a3}
.ns-flash{text-align:center;font-family:var(--mono);font-weight:700;color:var(--amber);min-height:1.5em;margin:10px 0 0}
.sn-canvas{display:block;width:100%;max-width:420px;height:auto;aspect-ratio:1;margin:0 auto;border:1px solid #2f323b}
.sn-pad{display:none;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(2,44px);gap:6px;justify-content:center;margin-top:10px}
.sn-pad button{font:inherit;font-size:1.2rem;background:#1a1d24;color:var(--amber);border:2px solid var(--amber);touch-action:manipulation}
.sn-up{grid-column:2}.sn-left{grid-column:1;grid-row:2}.sn-down{grid-column:2;grid-row:2}.sn-right{grid-column:3;grid-row:2}
@media(pointer:coarse){.sn-pad{display:grid}}
.cm-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:480px;margin:0 auto}
.cm-card{position:relative;aspect-ratio:1;border:2px solid #2f323b;background:var(--burg);cursor:pointer;padding:0;overflow:hidden;touch-action:manipulation}
.cm-back{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--disp);font-size:1.6rem;color:var(--amber);background:repeating-linear-gradient(45deg,var(--navy) 0 8px,var(--ink) 8px 16px)}
.cm-face{position:absolute;inset:0;display:grid;place-items:center;background:var(--cream);opacity:0;transition:opacity .15s}
.cm-face img{width:100%;height:100%;object-fit:cover;display:block}
.cm-glyph{font-size:2rem;color:#241b14}
.cm-card.up .cm-face{opacity:1}
.cm-card.done{border-color:#7ee0a3;cursor:default}
@media(max-width:720px){.cab-body{grid-template-columns:1fr}.screen{padding:10px;min-height:260px}.srv{min-height:64px;padding:10px 8px}}
footer{padding:20px 22px calc(30px + env(safe-area-inset-bottom));font-family:var(--mono);font-size:.8rem;border-top:3px double var(--burg);color:#999;display:flex;flex-wrap:wrap;align-items:center;gap:8px 24px}
.prompt{display:flex;align-items:center;gap:6px;flex:1 1 260px;min-width:0}
.prompt label{color:var(--amber);font-weight:700;white-space:nowrap}
.prompt input{flex:1;min-width:0;max-width:240px;background:transparent;border:0;border-bottom:1px dashed #555;color:var(--cream);font:inherit;padding:4px 2px;caret-color:var(--amber);border-radius:0}
.prompt input:focus{outline:none;border-bottom-color:var(--amber)}
.prompt:focus-within label{text-decoration:underline}
#cmd-out{flex-basis:100%;color:var(--cream);min-height:0;margin:0}
#cmd-out:empty{display:none}
#found{color:var(--amber)}
@media(max-width:820px){.home,.pj{grid-template-columns:1fr}.pj:nth-of-type(even){direction:ltr}
 .home .side{display:contents}.home .side>.box{order:1}.home .side>.box:first-child{order:-2}.home .hero{order:-1}
 .home .side>.box:first-child{display:grid;grid-template-columns:96px 1fr;gap:4px 14px;align-items:center}
 .home .side>.box:first-child .avatar{grid-row:1/3;margin:0;font-size:2rem}
 .home .side>.box:first-child .status{margin:0;font-size:.85rem}
 .home .side>.box:first-child .late{grid-column:2;margin:0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* HIRE: the one-page version */
.hire-link{display:block;flex-basis:100%;margin-top:14px;font-family:var(--mono);font-size:.85rem;color:var(--amber);text-underline-offset:3px}
.hire-intro{max-width:58ch;margin-top:10px}
.sheet{background:#fffdf7;color:#241b14;margin-top:30px;padding:40px clamp(20px,5vw,56px) 34px;box-shadow:0 1px 0 rgba(0,0,0,.08),8px 10px 0 rgba(36,27,20,.2);max-width:900px;position:relative}
.sheet::before{content:"";position:absolute;top:-12px;left:50%;width:120px;height:26px;margin-left:-60px;background:rgba(224,164,88,.75);transform:rotate(-2deg)}
.sheet-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:18px 30px;padding-bottom:22px;border-bottom:3px solid #241b14}
.sheet-head h2{font-size:clamp(2rem,5vw,3rem);line-height:.95;margin:0 0 10px}
.sheet-line{font-size:1.2rem;font-style:italic;line-height:1.4;max-width:42ch;margin:0}
.sheet-loc{font-family:var(--mono);font-size:.85rem;color:var(--burg);font-weight:700;margin:8px 0 0}
.sheet-contact{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;font-family:var(--mono);font-weight:700}
.sheet-contact .btn{margin:0}
.sheet-contact a:not(.btn){color:#241b14;text-underline-offset:3px}
.sheet-cols{display:grid;grid-template-columns:1fr 1fr;gap:34px;padding:24px 0;border-bottom:1px solid rgba(36,27,20,.25)}
.sheet h3{font-family:var(--mono);font-weight:700;font-size:.95rem;color:var(--burg);margin:0 0 10px}
.sheet h3:not(:first-child){margin-top:22px}
.sheet-list{margin:0;padding:0;list-style:none}
.sheet-list li{position:relative;padding-left:18px;margin-bottom:10px;line-height:1.5}
.sheet-list li::before{content:"";position:absolute;left:0;top:.62em;width:8px;height:8px;background:var(--amber)}
.sheet-small{font-size:.9rem;opacity:.75;margin:-4px 0 10px}
.tally{list-style:none;margin:0;padding:0;font-family:var(--mono);font-size:.82rem}
.tally li{display:grid;grid-template-columns:minmax(0,9.5em) 1fr auto;align-items:center;gap:10px;margin-bottom:5px}
.tally span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tally i{display:block;height:9px;background:linear-gradient(90deg,#241b14 calc(var(--n)*100%),rgba(36,27,20,.1) 0)}

.sheet-facts{margin:0}
.sheet-facts div{display:grid;grid-template-columns:8.5em 1fr;gap:10px;padding:4px 0;border-bottom:1px dotted rgba(36,27,20,.3)}
.sheet-facts dt{font-family:var(--mono);font-weight:700;font-size:.8rem}
.sheet-facts dd{margin:0;font-size:.95rem}
.sheet-work{padding-top:24px}
.sw{display:grid;grid-template-columns:minmax(0,1fr);padding:12px 0;border-bottom:1px dotted rgba(36,27,20,.3)}

const textHtml=t=>String(t||'').split(/\n\s*\n/).map(b=>{const L=b.split('\n').filter(x=>x.trim());
 return L.length&&L.every(x=>/^\s*-\s+/.test(x))?`<ul>${L.map(x=>`<li>${esc(x.replace(/^\s*-\s+/,''))}</li>`).join('')}</ul>`:`<p>${L.map(esc).join('<br>')}</p>`}).join('');
/* Spotify / YouTube links can be played on the page (the player loads only after a click). */
function embedOf(u){try{const x=new URL(u);
 if(x.hostname==='open.spotify.com'){const m=x.pathname.match(/^\/(?:intl-[a-z-]+\/)?(track|album|playlist|artist|episode|show)\/([A-Za-z0-9]+)/);if(m)return{src:`https://open.spotify.com/embed/${m[1]}/${m[2]}`,h:/track|episode/.test(m[1])?152:380}}
 let id=null;
 if(/(^|\.)youtube\.com$/.test(x.hostname))id=x.searchParams.get('v')||(x.pathname.match(/^\/(?:shorts|embed|live)\/([\w-]{11})/)||[])[1];
 if(x.hostname==='youtu.be')id=x.pathname.slice(1,12);
 if(id&&/^[\w-]{11}$/.test(id))return{src:`https://www.youtube-nocookie.com/embed/${id}?autoplay=1`,h:0,video:1}
}catch{}return null}

 const u=safeUrl(h.nowListeningLink),e=u&&embedOf(u);
 return `<section class="tt-wrap" aria-labelledby="tt-t"><div class="tt" id="tt" data-link="${esc(u)}" aria-hidden="true">

 ${e?`<button class="btn" type="button" data-play="${esc(u)}" data-title="${esc(nl)}">Drop the needle</button>`:''}${u?`<a class="tt-out" href="${esc(u)}" target="_blank" rel="noopener">Open in ${/spotify/.test(u)?'Spotify':/youtu/.test(u)?'YouTube':'a new tab'} ↗</a>`:''}

 const e=embedOf(link);if(!e)return;
 const d=$('#dock');
 d.innerHTML=`<div class="dock-bar"><span class="dock-disc" aria-hidden="true"></span><p class="dock-title"><small>Now playing</small><b></b></p>
  <button class="dock-btn" type="button" id="dock-min" aria-expanded="true">Hide</button><button class="dock-btn" type="button" id="dock-x">Stop</button></div>
  <div class="dock-frame${e.video?' video':''}"><iframe title="" src="${esc(e.src)}" height="${e.video?'':e.h>152?152:80}" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" referrerpolicy="strict-origin-when-cross-origin"></iframe></div>`;
 d.querySelector('b').textContent=title;d.querySelector('iframe').title=title;
 d.hidden=false;document.body.classList.add('has-dock');nowPlaying=link;syncDeck();
 $('#dock-x').onclick=()=>{d.hidden=true;d.innerHTML='';document.body.classList.remove('has-dock');nowPlaying='';syncDeck()};

function wireBrowser(){
 const w=$('.bw');if(!w)return;
 const L=JSON.parse(w.dataset.links),tabs=[...w.querySelectorAll('.bw-tab')],page=$('#bwp'),url=$('#bwu');
 const show=i=>{const l=L[i];tabs.forEach((t,k)=>{t.setAttribute('aria-selected',k==i);t.tabIndex=k==i?0:-1});page.setAttribute('aria-labelledby','bwt'+i);
  url.textContent=l.u.replace(/^https?:\/\//,'');

 tabs.forEach((t,i)=>{t.onclick=()=>show(i);t.onkeydown=e=>{const d={ArrowRight:1,ArrowLeft:-1}[e.key];if(e.key=='Home'||e.key=='End'||d){e.preventDefault();const n=e.key=='Home'?0:e.key=='End'?tabs.length-1:(i+d+tabs.length)%tabs.length;tabs[n].focus();show(n)}}});

function wireHolo(){

  c.onpointerleave=()=>{c.style.transform='';c.style.removeProperty('--mx');c.style.removeProperty('--my')}
 })

function applySeason(){
 const s=S('footer').seasons==='off'?'':seasonToday(),on=s&&seasonPref()!=='off',b=$('#season-btn');
 const label={december:'festive',october:'spooky'}[s];
 if(b){b.hidden=!s;b.textContent=s?`${on?'✦':'✧'} ${label} mode ${on?'on':'off'}`:'';b.setAttribute('aria-pressed',!!on);b.onclick=()=>{try{localStorage.setItem('nikh-season',on?'off':'on')}catch{}applySeason();render(true)}}
 const want=on?s:'';if((document.body.dataset.season||'')===want)return;
 if(want)document.body.dataset.season=want;else delete document.body.dataset.season;
 let L=$('#lights');if(L)L.remove();
 if(want){L=document.createElement('button');L.id='lights';L.type='button';L.className='lights';L.setAttribute('aria-label','String lights: click to switch them off or on');
  L.innerHTML=Array.from({length:44},(_,i)=>`<i style="--i:${i}"></i>`).join('');
  L.onclick=()=>{L.classList.toggle('off');window.NikhSound&&NikhSound.blip(L.classList.contains('off')?220:880,.06,'square')};
  document.querySelector('header').append(L)}
 if(!want)letItSnow(false)
}
/* Snow only when someone asks for it (type "snow" in the prompt). */
var snowStop=null;
function letItSnow(on){
 if(snowStop){snowStop();snowStop=null}
 if(!on)return false;
 if(matchMedia('(prefers-reduced-motion: reduce)').matches)return 'reduced';
 const c=document.createElement('canvas');c.className='snow';c.setAttribute('aria-hidden','true');document.body.append(c);
 const x=c.getContext('2d');let W,H,raf;const fit=()=>{W=c.width=innerWidth;H=c.height=innerHeight};fit();addEventListener('resize',fit);
 const F=Array.from({length:Math.min(120,Math.round(innerWidth/9))},()=>({x:Math.random()*W,y:Math.random()*H,r:1+Math.random()*2.4,v:.4+Math.random()*1.1,w:Math.random()*6}));
 const step=t=>{x.clearRect(0,0,W,H);x.fillStyle='rgba(241,231,211,.85)';for(const f of F){f.y+=f.v;f.x+=Math.sin(t/1400+f.w)*.4;if(f.y>H+4){f.y=-4;f.x=Math.random()*W}x.beginPath();x.arc(f.x,f.y,f.r,0,7);x.fill()}raf=requestAnimationFrame(step)};
 raf=requestAnimationFrame(step);snowStop=()=>{cancelAnimationFrame(raf);removeEventListener('resize',fit);c.remove()};return true
}
window.nikhSnow=()=>letItSnow(!snowStop);
/* Hall of fame: this week's best score per game. Shown on Home and the Arcade. */
var fameCache=null;
async function loadFame(){
 const box=$('#fame'),plq=$('#plaque');if(!box&&!plq)return;
 try{if(!fameCache||Date.now()-fameCache.at>60000){const r=await fetch('/api/arcade?r=week');if(!r.ok)return;fameCache={at:Date.now(),d:await r.json()}}}catch{return}
 const {games,champs}=fameCache.d,rows=Object.keys(games).map(k=>[games[k],champs[k]]);
 const list=`<ol class="fame-list">${rows.map(([n,c])=>`<li><span>${esc(n)}</span><b>${c?esc(c.initials):'---'}</b><i>${c?c.score:'open'}</i></li>`).join('')}</ol>`;
 const any=rows.some(r=>r[1]);
 if(box&&document.body.contains(box)){$('#fame-list').innerHTML=list+(any?'<a class="fame-go" href="/arcade">Think you can beat them?</a>':'<a class="fame-go" href="/arcade">Nobody has claimed this week yet. Insert coin.</a>');box.hidden=false}
 if(plq&&document.body.contains(plq)){plq.innerHTML=`<p class="plq-t">Hall of fame <span>this week</span></p>${list}`;plq.hidden=false}
}
/* Keyboard shortcuts for people who live in their editor. Press ? to see them. */
(function(){
 const GO={h:'/',a:'/about',p:'/projects',j:'/journal',s:'/scrapbook',l:'/links',b:'/guestbook',m:'/music',r:'/arcade',c:'/contact',i:'/hire',u:'/status'};
 const NAMES={h:'Home',a:'About',p:'Projects',j:'Journal',s:'Scrapbook',l:'Links',b:'Guestbook (the board)',m:'Music',r:'Arcade (r for retro)',c:'Contact',i:'Hire me',u:'Under the hood'};
 const K=$('#keys'),list=$('#keys-list');if(!K)return;
 list.innerHTML=`<div><dt><kbd>?</kbd></dt><dd>Show this list</dd></div>`+Object.keys(GO).map(k=>`<div><dt><kbd>g</kbd> <kbd>${k}</kbd></dt><dd>${NAMES[k]}</dd></div>`).join('')+
  `<div><dt><kbd>/</kbd></dt><dd>Jump to the command prompt</dd></div><div><dt><kbd>[</kbd> <kbd>]</kbd></dt><dd>Previous or next journal page</dd></div><div><dt><kbd>Esc</kbd></dt><dd>Close windows and menus</dd></div>`;
 const open=()=>{if(!K.open)K.showModal()};$('#keys-x').onclick=()=>K.close();K.addEventListener('click',e=>{if(e.target===K)K.close()});
 const ko=$('#keys-open');if(ko)ko.onclick=open;
 let lead=0,lastKey=0;
 document.addEventListener('keydown',e=>{
  const t=e.target,now=Date.now(),prev=lastKey;lastKey=now;
  if(e.ctrlKey||e.metaKey||e.altKey||e.isComposing)return;
  if(t instanceof Element&&t.closest('input,textarea,select,[contenteditable],dialog'))return;
  if(document.querySelector('dialog[open]')||document.body.hasAttribute('data-playing'))return;
  const k=e.key;
  if(k==='?'){e.preventDefault();lead=0;return open()}
  if(k==='/'){const c=$('#cmd');if(c){e.preventDefault();c.focus()}return}
  if(lead&&now-lead<1200){lead=0;const to=GO[k.toLowerCase()];if(to){e.preventDefault();nikhNav(to)}return}
  /* "g" only starts a shortcut after a short pause, so typing words (and secret phrases) never jumps pages. */
  if(k==='g'&&now-prev>700){lead=now;return}
  lead=0;
  if((k==='['||k===']')&&route()==='journal'){const b=document.querySelector(k==='['?'.nb-prev':'.nb-next');if(b&&!b.disabled){e.preventDefault();b.click()}}
 });
})();
/* Cookie-free stats: which pages get visited, which outbound links get clicked, which sites send people here.
 * No cookies, no identifiers; the server keeps only daily counts. Do Not Track and Global Privacy Control are respected. */
var trackOff=navigator.doNotTrack==='1'||window.doNotTrack==='1'||navigator.globalPrivacyControl===true||/^(localhost|127\.)/.test(location.hostname)&&!/[?&]track/.test(location.search);
function track(kind,item){if(trackOff||!item)return;try{fetch('/api/public?r=track',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({kind,item}),keepalive:true}).catch(()=>{})}catch{}}
var lastTracked='';
function trackView(k){const p=decodeURI(location.pathname).toLowerCase().replace(/\/+$/,'')||'/';if(k==='lost'||p===lastTracked)return;lastTracked=p;track('view',p)}
try{const r=document.referrer&&new URL(document.referrer);if(r&&r.host&&r.host!==location.host)track('ref',r.hostname)}catch{}
document.addEventListener('click',e=>{const a=e.target instanceof Element&&e.target.closest('a[href]');if(!a)return;const h=a.getAttribute('href');
 if(/^mailto:/i.test(h))return track('click','Email');
 if(!/^https?:/i.test(h))return;try{const u=new URL(h);if(u.host===location.host)return;track('click',(a.textContent.replace(/[↗\s]+/g,' ').trim().slice(0,50)||'Link')+' → '+u.hostname.replace(/^www\./,''))}catch{}},true);
async function loadScrapbook(){
 const box=$('#sb');
 const fmt=d=>new Date(d+'T12:00:00').toLocaleDateString(undefined,{year:'numeric',month:'long',day:'numeric'});
 /* The orange date a cheap film camera burns into the corner of a print. */
 const stamp=d=>{const [y,m,dd]=String(d).split('-');return `'${y.slice(2)} ${+m} ${+dd}`};
 let entries=[];
 try{const r=await fetch('/api/public?r=scrapbook');if(!r.ok)throw 0;({entries}=await r.json())}
 catch(e){box.innerHTML='<p class="sb-empty">The scrapbook is offline here. It needs the deployed backend.</p>';return}
 if(!entries.length){box.innerHTML='<p class="sb-empty">Nothing in the shoebox yet. Check back soon.</p>';return}
 box.innerHTML=entries.map((e,i)=>{
  let h=0;for(const c of (e.id||String(i)))h=(h*31+c.charCodeAt(0))>>>0;
  const tilt=((h%9)-4)*.7,shift=(h>>4)%3*8;const n=e.images.length;
  const words=e.title?`<h2>${esc(e.title)}</h2>`:'';
  if(!n)return `<article class="sbe slip" style="--t:${tilt}deg;--y:${shift}px">${e.date?`<time datetime="${esc(e.date)}">${fmt(e.date)}</time>`:''}${words}${e.body?`<p>${esc(e.body)}</p>`:''}</article>`;
  return `<article class="sbe print${n>1?' pile':''}" style="--t:${tilt}deg;--y:${shift}px"><button class="sb-open" type="button" data-i="${i}" aria-label="Open ${esc(e.title||'photo')}${n>1?`, ${n} photos`:''}">
   <span class="sb-photo">${img(e.images[0])}${e.date?`<span class="burn" aria-hidden="true">${stamp(e.date)}</span>`:''}</span>${n>1?`<span class="sb-count">${n} photos</span>`:''}</button>
   ${words}${e.body?`<p class="clamp">${esc(e.body)}</p>`:''}</article>`}).join('');
 box.querySelectorAll('img').forEach(i=>i.onerror=()=>i.remove());
 const dlg=$('#sbv'),body=$('#sbv-body');
 const show=(e,k)=>{const im=e.images[k];body.innerHTML=`<figure>${img(im)}${im.caption?`<figcaption>${esc(im.caption)}</figcaption>`:''}</figure>
   <div class="sbv-text">${e.date?`<time datetime="${esc(e.date)}">${fmt(e.date)}</time>`:''}${e.title?`<h2>${esc(e.title)}</h2>`:''}${e.body?`<p>${esc(e.body)}</p>`:''}
   ${e.images.length>1?`<p class="sbv-nav"><button type="button" class="btn ghost" data-d="-1">Previous</button><span>${k+1} of ${e.images.length}</span><button type="button" class="btn ghost" data-d="1">Next</button></p>`:''}</div>`;
  body.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>show(e,(k+ +b.dataset.d+e.images.length)%e.images.length))};
 box.querySelectorAll('.sb-open').forEach(b=>b.onclick=()=>{show(entries[+b.dataset.i],0);dlg.showModal()});
 dlg.querySelector('.sbv-x').onclick=()=>dlg.close();
 dlg.onclick=ev=>{if(ev.target===dlg)dlg.close()}
}
</script>
