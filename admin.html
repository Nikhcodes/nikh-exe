<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>Guestbook moderation</title>
<style>body{font-family:system-ui,sans-serif;max-width:720px;margin:30px auto;padding:0 16px;background:#14213a;color:#f1e7d3}
input,button{font:inherit;padding:8px 12px;margin:4px 4px 4px 0}.e{border:1px solid #6b1f2e;padding:12px;margin:12px 0;background:#22252d}.p{border-color:#e0a458}
small{color:#e0a458}</style></head><body>
<h1>Guestbook moderation</h1>
<p>Paste your ADMIN_TOKEN. It is kept in memory only and never stored.</p>
<input id="t" type="password" aria-label="Admin token" autocomplete="off"><button id="go">Load</button>
<div id="out"></div>
<script>
const out=document.getElementById('out');let token='';
async function api(method,body){const r=await fetch('/api/admin',{method,headers:{'Authorization':'Bearer '+token,'Content-Type':'application/json'},body:body&&JSON.stringify(body)});if(!r.ok)throw new Error(r.status===401?'Wrong token':'Error '+r.status);return r.json()}
async function load(){out.textContent='Loading...';try{const d=await api('GET');out.textContent='';if(!d.entries.length)out.textContent='Nothing yet.';
d.entries.forEach(e=>{const box=document.createElement('div');box.className='e'+(e.approved?'':' p');
const h=document.createElement('b');h.textContent=e.name;const s=document.createElement('small');s.textContent=' '+new Date(e.created_at).toLocaleString()+(e.approved?' (live)':' (PENDING)');
const p=document.createElement('p');p.textContent=e.message;box.append(h,s,p);
if(!e.approved){const a=document.createElement('button');a.textContent='Approve';a.onclick=async()=>{await api('POST',{id:e.id,action:'approve'});load()};box.append(a)}
const x=document.createElement('button');x.textContent='Delete';x.onclick=async()=>{if(confirm('Delete this entry?')){await api('POST',{id:e.id,action:'delete'});load()}};box.append(x);out.append(box)})}catch(err){out.textContent=err.message}}
document.getElementById('go').onclick=()=>{token=document.getElementById('t').value;load()};
</script></body></html>
