<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0d1018">
<title>Admin · NIKH.EXE</title>
<link href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Courier+Prime:wght@400;700&family=Newsreader:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/reveal.css">
<style>
:root{--ink:#0d1018;--navy:#14213a;--char:#22252d;--burg:#6b1f2e;--red:#b8343f;--amber:#e0a458;--cream:#f1e7d3;--paper:#e6d9bd;--ok:#7ec48e;--muted:#b9ae9c;
--disp:'Bowlby One',Impact,sans-serif;--mono:'Courier Prime',ui-monospace,monospace;--serif:'Newsreader',Georgia,serif}
*{box-sizing:border-box}
html{background:var(--ink)}
body{margin:0;min-height:100vh;color:var(--cream);background:radial-gradient(ellipse at 50% 0%,#14213a 0%,transparent 60%),var(--ink);font-family:var(--serif);font-size:1.02rem;line-height:1.55;overflow-wrap:anywhere;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
a{color:var(--amber)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
[hidden]{display:none!important}
h1,h2,h3{font-family:var(--disp);font-weight:400;line-height:1.1;margin:0}
h1{font-size:clamp(1.8rem,5vw,2.6rem)}
h2{font-size:1.35rem}
h3{font-size:1.05rem}
.mono{font-family:var(--mono)}
.muted{color:var(--muted)}
.small{font-size:.86rem}
/* top bar */
.top{border-bottom:3px double var(--burg);background:var(--char);position:sticky;top:0;z-index:30}
.top-in{width:min(100% - 28px,1120px);margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px;padding:10px 0}
.logo{font-family:var(--disp);color:var(--amber);text-decoration:none;transform:rotate(-1.5deg);display:inline-block;font-size:1.1rem}
.logo span{color:var(--cream)}
.tabs{display:flex;flex-wrap:wrap;gap:2px;flex:1}
.tabs a{font-family:var(--mono);font-weight:700;font-size:.86rem;color:var(--cream);text-decoration:none;padding:7px 10px;border:2px solid transparent;position:relative}
.tabs a:hover{border-color:var(--amber)}
.tabs a[aria-current=page]{background:var(--amber);color:var(--ink)}
.tabs .badge{margin-left:4px}
main{width:min(100% - 28px,1120px);margin:0 auto;padding:28px 0 80px}
/* building blocks */
.tape{display:inline-block;background:var(--amber);color:var(--ink);font-family:var(--mono);font-weight:700;font-size:.74rem;padding:3px 12px;transform:rotate(-2deg)}
.panel{border:2px solid var(--burg);background:var(--char);padding:18px;box-shadow:5px 5px 0 #0005;margin-top:20px}
.panel>h2:first-child,.panel>.ph{margin:-18px -18px 16px;padding:8px 18px;background:var(--burg);font-family:var(--mono);font-size:.82rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center}
.ph .grow{flex:1}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.row.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px 20px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:7px 14px;border:2px solid var(--amber);background:var(--amber);color:var(--ink);font-family:var(--mono);font-weight:700;font-size:.88rem;cursor:pointer;text-decoration:none;border-radius:0;line-height:1.2}
.btn:hover:not(:disabled){background:transparent;color:var(--amber)}
.btn.ghost{background:transparent;color:var(--amber)}
.btn.ghost:hover:not(:disabled){background:var(--amber);color:var(--ink)}
.btn.danger{border-color:var(--red);background:transparent;color:#f0a1a8}
.btn.danger:hover:not(:disabled){background:var(--red);color:var(--cream)}
.btn.sm{min-height:32px;padding:4px 10px;font-size:.8rem}
.btn:disabled{opacity:.5;cursor:wait}
label.f{display:grid;gap:5px;font-family:var(--mono);font-weight:700;font-size:.82rem;color:var(--amber)}
label.f .help{font-weight:400;color:var(--muted);font-size:.8rem}
input[type=text],input[type=password],input[type=search],input[type=number],input[type=date],input[type=datetime-local],select,textarea{width:100%;min-width:0;background:var(--ink);border:2px solid var(--burg);padding:8px 10px;color:var(--cream);font-family:var(--mono);font-size:.95rem;border-radius:0}
textarea{min-height:90px;resize:vertical;font-family:var(--serif);font-size:1rem}
input:focus,select:focus,textarea:focus{outline:3px solid var(--amber);outline-offset:1px}
.check{display:flex;gap:8px;align-items:center;font-family:var(--mono);font-size:.9rem;cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--amber)}
.badge{display:inline-block;font-family:var(--mono);font-size:.72rem;font-weight:700;padding:1px 7px;border:1.5px solid currentColor;white-space:nowrap}
.b-live{color:var(--ok)}.b-off{color:var(--muted)}.b-warn{color:var(--amber)}.b-bad{color:#f0a1a8}
.note{border-left:4px solid var(--amber);background:#1a1d24;padding:10px 12px;font-size:.92rem}
.note.warn{border-color:var(--red)}
details.adv{margin-top:16px;border:2px dashed #3a3d46;padding:10px 14px}
details.adv summary{cursor:pointer;font-family:var(--mono);font-weight:700;color:var(--amber)}
/* stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{background:var(--cream);color:#241b14;padding:12px 14px;box-shadow:4px 4px 0 #0007;text-decoration:none;display:block}
.stat:nth-child(odd){transform:rotate(-.6deg)}.stat:nth-child(even){transform:rotate(.5deg)}
.stat b{display:block;font-family:var(--disp);font-size:2rem;font-weight:400;line-height:1}
.stat span{font-family:var(--mono);font-size:.8rem;font-weight:700}
/* lists */
.items{display:grid;gap:12px}
.item{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:#1a1d24;border:2px solid #2f323b;padding:10px 12px}
.item .meta{min-width:0}
.item .meta b{font-family:var(--disp);font-weight:400;font-size:1.1rem}
.thumbs{display:flex;gap:6px;flex-wrap:wrap}
.th{width:56px;height:56px;object-fit:cover;background:#000;border:2px solid #3a3d46;display:block}
.th.empty{display:grid;place-items:center;border:2px dashed var(--amber);color:var(--amber);font-family:var(--mono);font-size:.62rem;text-align:center;line-height:1.1;padding:2px}
@media(max-width:640px){.item{grid-template-columns:1fr}.item .acts{justify-content:flex-start}}
.acts{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
/* media grid */
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.mcard{background:#1a1d24;border:2px solid #2f323b;padding:6px;text-align:left;cursor:pointer;display:grid;gap:4px;font-family:var(--mono);font-size:.78rem;width:100%}
.mcard:hover,.mcard:focus-visible{border-color:var(--amber)}
.mcard img{width:100%;aspect-ratio:1;object-fit:cover;background:#000;display:block}
.mcard .nm{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mcard[aria-pressed=true]{border-color:var(--amber);outline:3px solid var(--amber)}
.drop{border:2px dashed var(--amber);padding:16px;text-align:center;font-family:var(--mono);font-size:.9rem}
.drop.over{background:#2a2410}
/* steps editor */
.steps{display:grid;gap:12px;counter-reset:st}
.step{display:grid;grid-template-columns:120px 1fr;gap:14px;background:#1a1d24;border:2px solid #2f323b;padding:12px;position:relative}
.step::before{counter-increment:st;content:"STEP " counter(st);position:absolute;top:-10px;left:10px;background:var(--burg);font-family:var(--mono);font-size:.7rem;font-weight:700;padding:1px 8px}
.step .pic{width:120px;height:120px;object-fit:contain;background:#000;border:2px solid #3a3d46}
.slot-empty{width:120px;height:120px;border:3px dashed var(--amber);display:grid;place-content:center;text-align:center;font-family:var(--mono);font-size:.74rem;color:var(--amber);padding:6px;gap:4px}
.slot-empty b{font-size:.82rem}
@media(max-width:560px){.step{grid-template-columns:1fr}}
/* dialogs */
dialog.modal{margin:auto;border:2px solid var(--amber);background:var(--char);color:var(--cream);padding:0;width:min(96vw,900px);max-height:92vh;box-shadow:8px 8px 0 #000a}
dialog.modal::backdrop{background:#0d1018d0}
.mh{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--burg);font-family:var(--mono);font-weight:700;position:sticky;top:0;z-index:2}
.mh .grow{flex:1}
.mb{padding:16px;overflow:auto}
/* toast */
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:100;max-width:min(92vw,560px);padding:10px 16px;font-family:var(--mono);font-weight:700;box-shadow:4px 4px 0 #000a;background:var(--ok);color:var(--ink)}
#toast.err{background:#f0a1a8}
/* login */
.login{max-width:440px;margin:6vh auto 0}
.gbe{background:var(--cream);color:#241b14;padding:12px 14px;box-shadow:4px 4px 0 #0007}
.gbe p{white-space:pre-wrap;margin:6px 0 10px}
.gbe time{font-family:var(--mono);font-size:.78rem;color:var(--burg)}
.gbe b{font-family:var(--disp);font-weight:400}
.gbe .btn.ghost{color:#6b1f2e;border-color:#6b1f2e}
.gbe .btn.ghost:hover:not(:disabled){background:#6b1f2e;color:var(--cream)}
.seg{display:inline-flex;border:2px solid var(--amber)}
.seg button{background:transparent;border:0;padding:6px 12px;font-family:var(--mono);font-weight:700;cursor:pointer;color:var(--amber)}
.seg button[aria-pressed=true]{background:var(--amber);color:var(--ink)}
.preview-sb{background:#fbf6e8;color:#241b14;padding:14px;max-width:340px;margin:0 auto;box-shadow:5px 5px 0 #0007}
.preview-sb img{width:100%;display:block}
.preview-sb p{white-space:pre-wrap}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <a class="logo" href="/" title="View the public site">NIKH.EXE <span>/ admin</span></a>
  <nav class="tabs" id="tabs" aria-label="Admin sections" hidden></nav>
  <button class="btn ghost sm" id="logout" hidden>Log out</button>
</div></header>
<main id="main" aria-live="polite"><p class="mono">Loading…</p></main>
<div id="toast" role="status" aria-live="polite" hidden></div>
<script src="assets/reveal.js"></script>
<script src="assets/admin.js"></script>
</body>
</html>
